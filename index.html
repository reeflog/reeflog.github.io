<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#132c32;background:#eef5f3;--ink:#132c32;--muted:#506970;--line:#d5e5e1;--teal:#087667}
*{box-sizing:border-box}
body{margin:0} header{background:#0b2930;color:#fff} .bar,main{max-width:1080px;margin:auto;padding-inline:clamp(16px,4vw,38px)}
.bar{min-height:75px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:10px}
.brand{font-weight:800;font-size:1.35rem;letter-spacing:-.04em}.brand span{color:#70ddc7}
nav,.actions,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:8px 13px;font-weight:650}
button:hover{filter:brightness(.95)} button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #37a99b;outline-offset:2px}
nav button{background:transparent;color:white;border-color:#47636a}nav button[aria-current]{background:#23464d}
.primary{background:var(--teal);color:white;border-color:transparent}
main{padding-block:30px 54px}.hero{background:#d6eee8;border:1px solid #c3e1da;border-radius:22px;padding:clamp(20px,5vw,42px);display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1,h2,h3,p{margin:0}h1{font-size:clamp(2rem,6vw,3.7rem);letter-spacing:-.065em;line-height:1.05}h2{font-size:1.45rem;letter-spacing:-.035em}h3{font-size:1rem}.hero p{margin-top:10px;color:#365b5d}
section+section{margin-top:24px}.section-head{margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,225px),1fr));gap:12px}
.card,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:16px}.card{display:grid;gap:7px;align-content:start}.card button{justify-self:start;margin-top:4px}
.value{font-size:1.85rem;font-weight:750;letter-spacing:-.05em}.unit,.muted{font-size:.9rem;color:var(--muted);letter-spacing:normal}.unit{font-weight:500}
.pill{justify-self:start;border-radius:30px;padding:3px 10px;font-size:.88rem;font-weight:700;background:#eef3f4;color:#35525b}.good{background:#d9f4e9;color:#155643}.warn{background:#fff0d6;color:#7d4300}.attention{display:grid;gap:10px}
.indicator{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.dot{width:12px;height:12px;border-radius:50%;background:#78929a;flex:none}
.dot.green{background:#08845e}.dot.yellow{background:#c68a00}.dot.red{background:#c4353c}
.next-step{border-top:1px solid var(--line);padding-top:9px;margin-top:3px;font-size:.9rem;color:var(--muted)}
label{display:grid;gap:5px;font-size:.9rem;font-weight:650} input,select,textarea{width:100%;min-width:0;border:1px solid #b6cdca;padding:8px;border-radius:8px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto}.check{display:flex;align-items:center;gap:8px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,135px),1fr));gap:12px}.settings-row{padding:13px 0;border-top:1px solid var(--line);display:grid;gap:9px}.stack{display:grid;gap:14px}
.chart{width:100%;height:245px;display:block;margin-block:12px}.history article{border-top:1px solid var(--line);padding:11px 0;display:flex;justify-content:space-between;align-items:start;gap:10px}.note{white-space:pre-wrap;overflow-wrap:anywhere}
dialog{width:min(94vw,580px);max-height:90dvh;border:1px solid var(--line);border-radius:18px;padding:22px;color:var(--ink)}dialog::backdrop{background:#061f27a8}.alert{color:#8a321d;font-weight:650}.footer{margin-top:25px;color:var(--muted);font-size:.9rem}
@media(max-width:550px){.bar{align-items:flex-start}.bar nav{width:100%}.history article{flex-wrap:wrap}}

<body>
<header><div class="bar"><button class="brand" type="button" data-view="overview" aria-label="REEFLOG home"><span>REEF</span>LOG</button><nav aria-label="Main navigation"><button data-view="overview"><span class="nav-icon" aria-hidden="true">⌂</span>Overview</button><button data-view="dosing"><span class="nav-icon nav-drop" aria-hidden="true"></span>Dosing</button><button data-view="tasks"><span class="nav-icon" aria-hidden="true">✓</span>Tasks</button><button data-view="history"><span class="nav-icon" aria-hidden="true">◷</span>History</button><details id="settings-menu" class="settings-menu"><summary aria-label="Settings">Settings</summary><div class="settings-popover"><button data-view="tanks">Tanks</button><button data-view="account">Account</button><button data-view="targets">Targets</button><button data-view="backup">Backup</button></div></details></nav></div></header>
<main id="main"></main>
<dialog id="entry"><form id="test-form" class="stack"></form></dialog>
<dialog id="rename-tank" aria-labelledby="rename-title">
  <form id="rename-form" class="stack">
    <h2 id="rename-title">Rename tank</h2>
    <label>Tank name<input name="name" required maxlength="60"></label>
    <p id="rename-error" class="alert" role="status"></p>
    <div class="actions"><button class="primary">Save name</button><button type="button" id="cancel-rename">Cancel</button></div>
  </form>
</dialog>
<script>
'use strict';
const PARAMETERS = [
  ['alk','Alkalinity','dKH'], ['salt','Salinity','ppt'], ['ph','pH',''],
  ['no3','Nitrate','ppm'], ['po4','Phosphate','ppm'],
  ['ca','Calcium','ppm'], ['mg','Magnesium','ppm'], ['no2','Nitrite','ppm'],
  ['si','Silicate','ppm'], ['nh3','Ammonia','ppm']
];
// Inclusive healthy limits. Urgent limits are conservative retest triggers.
const MIXED_REEF = {
  alk: {low:7.5,high:10,urgentLow:6,urgentHigh:13},
  salt:{low:parseSalinity(1.024,'SG'),high:parseSalinity(1.026,'SG'),urgentLow:30,urgentHigh:38},
  ph:  {low:7.8,high:8.4,urgentLow:7.7,urgentHigh:8.6},
  no3: {low:1,high:10,urgentHigh:50},
  po4: {low:.02,high:.12},
  ca:  {low:400,high:480,urgentLow:350,urgentHigh:550},
  mg:  {low:1250,high:1400,urgentLow:1100,urgentHigh:1650},
  no2: {low:null,high:.2},
  si:  {low:null,high:2},
  nh3: {low:null,high:.1,urgentHigh:.5}
};
const CORAL_PROFILES = {
  soft:{label:'Soft',ranges:{alk:[7.5,11],no3:[2,20],po4:[.03,.15],ca:[380,480],mg:[1250,1450]}},

function salinityToGravity(ppt) {

      NEXT_STEPS[item.key][item.direction === 'Below' ? 0 : 1];
  }
  if (item.key === 'nh3' && item.direction && /FX203/i.test(item.reading.note) && item.reading.value <= .2) {
    return 'Above the total ammonia target and near this kit’s detection limit. Confirm with a fresh sample and a suitable low-range test.';
  }
  if (item.direction) {
    const bound = item.direction === 'Below' ? item.setting.low : item.setting.high;
    return item.direction + ' target of ' + format(bound) + (item.unit ? ' ' + item.unit : '') + '. Retest to confirm. ' +
      NEXT_STEPS[item.key][item.direction === 'Below' ? 0 : 1];
  }
  if (item.due) return 'The last test is overdue. Log a fresh reading.';
  return '';
}

function overview() {
  const profile = profileKey(state);
  const tankType = profile === 'fowlr' ? 'FOWLR' : CORAL_PROFILES[profile].label + ' reef';
  const volume = state.waterVolume;
  const age = tankAge(state.setupDate);
  const items = active().map(([key,name,unit]) => {
    const setting = config(key);
    const readings = records(key);
    const reading = readings[0];
    return {key,name,unit,reading,trend:stabilityTrend(key,readings),setting:displayTarget(key,setting),...assess(reading,setting)};
  });
  const order = ['red','yellow','green','gray'];
  items.sort((a,b) => order.indexOf(a.color) - order.indexOf(b.color));
  const count = color => items.filter(item => item.color === color).length;
  const visible = readingFilter ? items.filter(item => item.color === readingFilter) : items;
  return `<div class="dashboard"><section class="hero tank-overview"><div class="tank-details"><div class="tank-heading"><h1>${esc(state.name)}</h1>
    ${fleet.tanks.length > 1 ? `<span class="tank-heading-arrow" aria-hidden="true"></span><select id="overview-tank" aria-label="Switch tank">
      ${fleet.tanks.map(tank => `<option value="${esc(tank.id)}" ${tank.id === fleet.active ? 'selected' : ''}>${esc(tank.log.name)}</option>`).join('')}
      </select>` : ''}</div><p class="tank-meta">${tankType}${volume ? ` · ${doseNumber(volume.amount)} ${volume.unit}` : ''}${age ? ` · Tank age ${age.toLowerCase()}` : ''}</p></div>
    <button class="primary" data-add>Add water test</button></section>
  ${outstandingTasks()}
  <section aria-label="Reading summary and filters" class="summary">
    ${[['green','Healthy'],['yellow','Needs attention'],['red','Fix immediately']].map(([color,label]) =>
      `<button type="button" data-reading-filter="${color}" aria-pressed="${readingFilter === color}"><span class="dot ${color}" aria-hidden="true"></span><strong>${count(color)}</strong><span>${label}</span></button>`).join('')}
  </section>
  <section><div class="section-head"><h2>Latest readings</h2><div class="actions">${readingFilter ? '<button type="button" data-reading-filter="">Show all</button>' : ''}<button data-view="targets">Targets</button></div></div>
    <div class="parameter-list">${visible.map(parameterRow).join('') ||
      (readingFilter ? '<p class="muted">No readings with this status.</p>' : '<p class="muted">Enable a parameter under Targets.</p>')}</div>
  </section></div>`;
}

function parameterRow(item) {
  const advice = nextStep(item);
  const value = item.reading ? format(displayParameterValue(item.key,item.reading.value)) : '—';
  const status = item.reading ? `${value} ${item.unit}. ${item.label}.` : item.label;
  return `<article class="parameter-row" data-status="${item.color}">
    <button type="button" class="parameter-open" data-history="${item.key}" aria-label="View ${item.name} history. ${status}">
      <span class="parameter-label"><strong>${item.name}</strong><small>${range(item.setting,item.unit)}</small></span>
      <span class="parameter-reading"><strong>${value} <span class="unit">${item.unit}</span></strong>
        <small class="indicator"><span class="dot ${item.color}" aria-hidden="true"></span>${item.label}</small></span>
      <span class="parameter-chevron" aria-hidden="true"></span>
    </button>
    ${item.reading ? `<div class="parameter-advice"><small><time datetime="${item.reading.date}">${dateText(item.reading.date)}</time></small>${item.trend ? trendSummary(item.trend,item.unit) : ''}</div>` : ''}
    ${advice ? `<details class="parameter-advice"><summary>What to check</summary><p>${advice}</p></details>` : ''}
  </article>`;
}

function taskIsDue(task,today = localDate(Date.now()).slice(0,10)) {
  return !task.done && task.reminder !== null && task.reminder <= today;
}

const openTasks = () => state.tasks.filter(task => !task.done)
  .sort((a,b) => (a.reminder ?? '9999-12-31').localeCompare(b.reminder ?? '9999-12-31'));

function taskReminder(task,today) {
  if (!task.reminder) return '';
  const due = taskIsDue(task,today);
  const prefix = task.done ? 'Reminder was' : task.reminder < today ? 'Overdue' : due ? 'Due today' : 'Reminder';
  const date = new Date(task.reminder+'T12:00:00').toLocaleDateString(undefined,{dateStyle:'medium'});
  return `<small class="${due ? 'task-due' : 'muted'}">${prefix} · <time datetime="${task.reminder}">${date}</time></small>`;
}

function waterChangeDate(date,days) {
  const due = new Date(localDate(date).slice(0,10));
  due.setUTCDate(due.getUTCDate()+days);
  return due.toISOString().slice(0,10);
}

function waterChangePanel() {
  const upcoming = openTasks().filter(task => task.kind === 'water');
  const completed = state.tasks.filter(task => task.kind === 'water' && task.done && task.completedAt)
    .sort((a,b) => b.completedAt.localeCompare(a.completedAt));
  const today = localDate(Date.now()).slice(0,10);
  return `<div class="workspace-toolbar">
    <div><h2>Water changes</h2><p class="muted">${completed.length ? 'Last change · ' + dateText(completed[0].completedAt) : 'No water changes logged'}</p></div>
    <button type="button" class="primary" data-log-water-change>Log water change</button>
  </div>
  ${upcoming.map(task => `<div class="actions"><span>Next water change</span>${taskReminder(task,today) || '<small class="muted">No date set</small>'}
    <button type="button" data-delete-task="${esc(task.id)}">Remove reminder</button></div>`).join('')}
  ${completed.length > 1 ? `<details><summary>Recent changes</summary><ul>${completed.slice(0,10).map(task =>
    `<li><time datetime="${task.completedAt}">${dateText(task.completedAt)}</time></li>`).join('')}</ul></details>` : ''}`;
}

function outstandingTasks() {
  const open = openTasks();
  if (!open.length) return '';
  const today = localDate(Date.now()).slice(0,10);
  const due = open.filter(task => taskIsDue(task,today)).length;
  return `<section class="panel task-preview" aria-labelledby="outstanding-tasks-heading">
    <div class="section-head"><div><h2 id="outstanding-tasks-heading">Outstanding tasks</h2>
      ${due ? `<p class="task-due">${due} ${due === 1 ? 'task' : 'tasks'} due</p>` : ''}</div>
      <button data-view="tasks">View all${open.length > 3 ? ' (' + open.length + ')' : ''}</button>
    </div>
    <ul class="outstanding-tasks">${open.slice(0,3).map(task => `<li>${esc(task.text)}${taskReminder(task,today)}</li>`).join('')}</ul>
  </section>`;
}

function taskList(completed = false) {
  const today = localDate(Date.now()).slice(0,10);
  const tasks = (completed ? state.tasks.filter(task => task.done) : openTasks()).filter(task => task.kind !== 'water');
  if (completed && !tasks.length) return '';
  const row = task => {
    return `<div class="task-row ${task.done ? 'task-complete' : ''}">
      <label><input type="checkbox" data-task="${esc(task.id)}" ${task.done ? 'checked' : ''} ${task.doseId ? 'disabled' : ''}><span class="task-check" aria-hidden="true"></span>
      <span><span class="task-title">${esc(task.text)}</span>${taskReminder(task,today)}${task.repeatDays ? `<small class="muted">Repeats every ${task.repeatDays} days</small>` : ''}</span></label>
      <div class="actions">${task.doseId && !task.done ? `<button type="button" data-log-retest="${esc(task.id)}">Log retest</button>` : ''}
      <button type="button" class="danger" data-delete-task="${esc(task.id)}" aria-label="Delete task ${esc(task.text)}">Delete</button></div>
    </div>`;
  };
  return `<div class="panel stack"><h2>${completed ? 'Completed' : 'Open tasks'}</h2>${tasks.map(row).join('') || '<p class="muted">No open tasks.</p>'}</div>`;
}

function refreshTaskLists() {
  main.querySelector('#task-list').innerHTML = taskList();
  main.querySelector('#completed-tasks').innerHTML = taskList(true);
}

function taskView() {
  return `<section class="stack">
    <div class="page-heading"><h1>Tasks</h1><p class="muted">${esc(state.name)}</p></div>
    <p id="task-message" role="status"></p>
    <div id="task-list">${taskList()}</div>
    <div class="task-layout">
    <section id="water-changes" class="panel stack water-change-panel">${waterChangePanel()}</section>
    <form id="task-form" class="panel stack task-compose"><h2>Add a task</h2>

function dosing() {
  const doses = [...state.doses].sort((a,b) => b.date.localeCompare(a.date));
  const last = doses[0];
  const waterVolume = state.waterVolume;
  const volumeUnit = waterVolume?.unit ?? 'L';
  return `<section class="stack"><div class="page-heading"><h1>Dosing</h1><p class="muted">${esc(state.name)}</p></div>
    <div class="dose-layout">
      <form id="dose-form" class="panel stack" data-tank="${esc(fleet.active)}" data-volume-unit="${volumeUnit}">
        <div class="workspace-toolbar"><div><h2>Dose details</h2><p class="muted">${waterVolume ? `Water volume · ${doseNumber(waterVolume.amount)} ${volumeUnit}` : 'Tank volume required'}</p></div>
          <button type="button" data-view="tanks" data-edit-active-tank>${waterVolume ? 'Edit volume' : 'Set volume in Tanks'}</button></div>
        <label>Product<input name="brand" list="dose-products" autocomplete="off" required maxlength="100" value="${esc(last?.brand ?? '')}" placeholder="Search by brand or product"></label>
        <datalist id="dose-products">${DOSE_PRODUCTS.map(product => `<option value="${esc(product.name)}"></option>`).join('')}</datalist>
        <label>Parameter to raise<select name="key">${DOSE_PARAMETERS.map(key =>
          `<option value="${key}" ${key===(last?.key ?? 'alk')?'selected':''}>${parameter(key)[1]}</option>`).join('')}</select></label>
        <div class="dose-fields">
          <label>Dose amount<input name="amount" type="number" inputmode="decimal" step="any" min="0" required></label>
          <label>Product unit<select name="unit">${DOSE_UNITS.map(unit => `<option ${unit===last?.unit?'selected':''}>${unit}</option>`).join('')}</select></label>
        </div>
        <fieldset class="form-group stack"><legend>Label strength</legend>
        <p id="dose-label-note" class="muted"></p>
        <div class="dose-fields">
          <label>Label dose<input name="labelAmount" type="number" inputmode="decimal" step="any" min="0" required></label>
          <label>Label water volume (${volumeUnit})<input name="labelVolume" type="number" inputmode="decimal" step="any" min="0" required></label>
          <label><span>Label rise (<span id="dose-rise-unit"></span>)</span><input name="labelRise" type="number" inputmode="decimal" step="any" min="0" required></label>
        </div></fieldset>
      </form>
      <section class="panel stack" aria-labelledby="dose-projection-heading">
        <h2 id="dose-projection-heading">Dose projection</h2>
        <div id="dose-preview" aria-live="polite" class="stack"></div>
        <div id="dose-suggestion" class="stack" aria-live="polite"></div>
        <p class="muted">Follow the label limits and retest after dosing.</p>
        <div><button type="submit" form="dose-form" class="primary" ${waterVolume ? '' : 'disabled'}>Log dose</button></div>
        <p id="dose-message" role="status"></p>
      </section>
    </div>
    <section class="panel history"><h2>Dose history</h2>${doses.map(dose => {
      const [,name,unit] = parameter(dose.key);
      const projection = dose.baseline ? `${doseNumber(dose.baseline.value)} → ${doseNumber(dose.baseline.value + doseIncrease(dose))} ${unit} estimated` : 'No baseline test';
      const retest = doseRetest(dose);
      const pending = state.tasks.find(task => task.doseId === dose.id && !task.done);
      return `<article><div><strong>${esc(dose.brand)}</strong><div>${name} · ${doseNumber(dose.amount)} ${dose.unit}</div>
        <div class="muted">${projection} · ${dateText(dose.date)}</div>
        ${retest ? retestComparison(dose,retest,unit) : ''}</div>
        <div class="actions">${pending ? '<button data-view="tasks">View retest task</button>' : !retest ?
          `<button data-schedule-retest="${esc(dose.id)}">Schedule retest</button>` : ''}
        <button class="danger" data-delete-dose="${esc(dose.id)}">Delete dose</button></div></article>`;
    }).join('') || '<p class="muted">No doses logged.</p>'}</section>
  </section>`;
}

const doseNumber = value => value.toLocaleString(undefined,{maximumSignificantDigits:8});
const doseRetest = dose => state.readings.find(row => row.id === dose.retestId && row.key === dose.key && row.date >= dose.date);

function retestComparison(dose,retest,unit) {
  const between = date => date > dose.date && date <= retest.date;
  const doses = state.doses.filter(item => item.id !== dose.id && between(item.date)).length;
  const changes = state.tasks.filter(task => task.kind === 'water' && task.done && between(task.completedAt)).length;
  const events = [doses ? `${doses} additional ${doses === 1 ? 'dose' : 'doses'}` : '',
    changes ? `${changes} water ${changes === 1 ? 'change' : 'changes'}` : ''].filter(Boolean);
  const before = dose.baseline ? doseNumber(dose.baseline.value) + ' ' + unit : 'Unavailable';
  const projected = dose.baseline ? doseNumber(dose.baseline.value + doseIncrease(dose)) + ' ' + unit : 'Unavailable';
  return `<p>Before <strong>${before}</strong> · Projected <strong>${projected}</strong> · Measured <strong>${doseNumber(retest.value)} ${unit}</strong></p>
    ${events.length ? `<p class="muted">Also logged before retest: ${events.join(' and ')}.</p>` : ''}`;
}
const doseProduct = name => DOSE_PRODUCTS.find(product => product.name.toLowerCase() === name.trim().toLowerCase());
const gallons = (volume,unit) => unit === 'L' ? volume / LITERS_PER_US_GALLON : volume;
const productVolume = (product,unit) => unit === 'L' ? product.liters : gallons(product.liters,'L');
const displayedProductVolume = (product,unit) => unit === 'US gal'
  ? productVolume(product,unit).toFixed(2) : productVolume(product,unit);

function fillDoseProduct(form) {
  const fields = form.elements;
  const product = doseProduct(fields.brand.value);
  if (!product) return false;
  fields.key.value = product.key;
  fields.unit.value = product.unit;
  fields.labelAmount.value = product.amount;
  fields.labelVolume.value = displayedProductVolume(product,form.dataset.volumeUnit);
  fields.labelRise.value = product.rise;
  return true;
}

function matchesDoseProduct(dose,product) {
  return product && dose.key === product.key && dose.unit === product.unit &&
    dose.labelAmount === product.amount && dose.labelRise === product.rise &&
    dose.labelVolume === Number(displayedProductVolume(product,dose.volumeUnit));
}

function exactDoseStrength(dose,product) {
  return matchesDoseProduct(dose,product) ? {...dose,labelVolume:productVolume(product,dose.volumeUnit)} : dose;
}

function doseSuggestion(dose,latest,{low,high},unit) {
  if (!dose.brand) return 'Select a product or enter its label strength.';
  if (!state.waterVolume) return 'Save the tank’s water volume to see a suggested amount.';
  if (!latest) return 'Add a water test to see a suggested amount.';
  if (high !== null && latest.value > high) return 'The latest test is above target. A product that raises this parameter would increase it further.';
  if (low === null) return 'Set a lower target to calculate an amount.';
  if (latest.value >= low) return 'The latest test meets the lower target. No increase is suggested.';
  const reference = {...dose,amount:1};
  if (!validDose(reference)) return 'Enter the full label strength to calculate an amount.';
  const amount = (low - latest.value) / doseIncrease(reference);
  if (!Number.isFinite(amount) || amount <= 0) return 'Check the entered label strength.';
  return `<div class="dose-values"><div><span>Estimated total amount</span><strong>${doseNumber(amount)} ${dose.unit}</strong></div>
    <div><span>Target to reach</span><strong>${doseNumber(low)} ${unit}</strong></div></div>
    <p class="muted">This estimate aims for the bottom of your target range. Follow the product’s dosing limits, split the correction as directed, and retest before adding more.</p>`;
}

function doseRate(amount,volume,volumeUnit,unit) {
  const rate = amount / gallons(volume,volumeUnit);
  return Number.isFinite(rate) && rate > 0 ? `${doseNumber(rate)} ${unit} per US gal` : '';
}

function readDose(form) {
  const data = new FormData(form);
  const dose = {key:data.get('key'),brand:data.get('brand').trim(),unit:data.get('unit'),
    volumeUnit:state.waterVolume?.unit ?? 'L',tankVolume:state.waterVolume?.amount ?? 0};
  for (const field of ['amount','labelAmount','labelVolume','labelRise']) dose[field] = Number(data.get(field));
  return dose;
}

function projectionMap(current, projected, {low,high}) {
  const values = [current,projected,low,high].filter(Number.isFinite);
  const start = Math.min(...values);
  const end = Math.max(...values);
  const scale = Math.max(Math.abs(start),Math.abs(end),1);
  const span = end / scale - start / scale;
  const position = value => span > 0 ? 4 + ((value / scale - start / scale) / span) * 92 : 50;
  const from = position(current);
  const to = position(projected);
  const left = low === null ? 0 : position(low);
  const right = high === null ? 100 : position(high);
  const band = low !== null || high !== null ? `<span class="dose-band" style="left:${left}%;width:${Math.max(0,right-left)}%"></span>` : '';
  return `<div class="dose-map" aria-hidden="true">${band}<span class="dose-path" style="left:${from}%;width:${to-from}%"></span>
    <span class="dose-marker" style="left:${from}%"></span><span class="dose-marker projected" style="left:${to}%"></span></div>
    <p class="dose-legend" aria-hidden="true">● Latest test · ◆ Projected${band ? ' · Green target zone' : ''}</p>`;
}

function updateDosePreview() {
  const form = main.querySelector('#dose-form');
  const input = readDose(form);
  const product = doseProduct(input.brand);
  const dose = exactDoseStrength(input,product);
  const [,name,unit] = parameter(dose.key);
  const target = config(dose.key);
  const latest = records(dose.key)[0];
  const labelRate = doseRate(dose.labelAmount,dose.labelVolume,dose.volumeUnit,dose.unit);
  const enteredRate = doseRate(dose.amount,dose.tankVolume,dose.volumeUnit,dose.unit);
  form.dataset.catalogStrength = matchesDoseProduct(input,product) ? 'yes' : '';
  main.querySelector('#dose-label-note').innerHTML = form.dataset.catalogStrength
    ? `Check these values against your label. <a href="${product.source}" target="_blank" rel="noopener noreferrer">Manufacturer’s directions</a>`
    : 'Use the dose, water volume, and expected rise printed on your label.';
  const rise = validDose(dose) ? doseIncrease(dose) : null;
  const result = latest && rise !== null ? latest.value + rise : null;
  const projected = Number.isFinite(result) ? result : null;
  const outcome = projected === null ? '' : target.low !== null && projected < target.low ? 'Below target' :
    target.high !== null && projected > target.high ? 'Above target' : target.low === null && target.high === null ? '' : 'Within target';
  form.querySelector('#dose-rise-unit').textContent = unit;
  const test = latest ? `${doseNumber(latest.value)} ${unit}` : '—';
  const estimate = projected === null ? '—' : `${doseNumber(projected)} ${unit}`;
  main.querySelector('#dose-preview').innerHTML = `<div class="dose-values">
    <div><span>Latest ${name} test</span><strong>${test}</strong>${latest ? `<span class="muted">${dateText(latest.date)}</span>` : ''}</div>
    <div><span>Projected after dose</span><strong>${estimate}</strong>${rise !== null ? `<span class="muted">+${doseNumber(rise)} ${unit} estimated</span>` : ''}</div></div>
    ${projected !== null ? projectionMap(latest.value,projected,target) : ''}
    ${labelRate && dose.labelRise > 0 ? `<p class="muted">Label reference · ${labelRate} for a rise of ${doseNumber(dose.labelRise)} ${unit}</p>` : ''}
    ${enteredRate ? `<p class="muted">Entered dose · ${enteredRate}</p>` : ''}
    <p>${range(target,unit)}${outcome ? ` · <strong>${outcome}</strong>` : ''}</p>
    ${!latest ? `<div><button type="button" data-add="${dose.key}">Add a baseline test</button></div>` : ''}`;
  main.querySelector('#dose-suggestion').innerHTML = `<h3>Suggested amount</h3><div class="stack">${doseSuggestion(dose,latest,target,unit)}</div>`;
}

function stabilityTrend(key,readings) {
  const latest = new Map();
  for (const row of readings) {
    if (!latest.has(row.date)) latest.set(row.date,displayParameterValue(key,row.value));
    if (latest.size === 5) break;
  }
  if (latest.size < 3) return null;
  const values = [...latest.values()].reverse();
  const rising = values.some((value,index) => index > 0 && value > values[index-1]);
  const falling = values.some((value,index) => index > 0 && value < values[index-1]);
  const label = rising && falling ? 'Fluctuating' : rising ? 'Rising' : falling ? 'Falling' : 'Steady';
  return {label,count:values.length,low:Math.min(...values),high:Math.max(...values)};
}

function trendSummary(trend,unit,includeRange = false) {
  const suffix = unit ? ' ' + unit : '';
  const spread = trend.low === trend.high ? format(trend.low) : format(trend.low) + '–' + format(trend.high);
  return `<p class="parameter-trend"><strong>${trend.label}</strong> over the last ${trend.count} tests${includeRange ? ` · Observed ${spread}${suffix}` : ''}</p>`;
}

function historyView() {
  const [key,name,unit] = parameter(selected);
  const readings = records(key);
  const trend = stabilityTrend(key,readings);
  return `<section class="stack"><div class="workspace-heading"><div class="page-heading"><h1>History</h1><p class="muted">${esc(state.name)}</p></div><button class="primary" data-add="${key}">Add water test</button></div>
    <div class="panel stack"><div class="workspace-toolbar"><label>Parameter<select id="history-filter">${PARAMETERS.map(([id,label]) => `<option value="${id}" ${id===key?'selected':''}>${label}</option>`).join('')}</select></label>
    <p class="muted">${range(displayTarget(key,config(key)),unit)}${readings.length ? ` · ${Math.min(readings.length,60)} plotted` : ''}</p></div>
    ${readings.length ? `<canvas class="chart" id="chart" role="img" aria-label="${name} trend. Values are listed below."></canvas>
    ` : ''}
    <div class="chart-summary"><h3>Stability trend</h3>${trend ? trendSummary(trend,unit,true) : '<p class="muted">Available after three separate tests.</p>'}</div></div></section>
    <section class="panel history"><h2>${name} readings</h2>${readings.map(row => `<article><div><strong>${format(displayParameterValue(key,row.value))} ${unit}</strong><div class="muted">${dateText(row.date)}</div>
    ${row.note ? `<p class="note">${esc(row.note)}</p>` : ''}</div><div class="actions"><button data-edit="${esc(row.id)}">Edit</button><button class="danger" data-delete="${esc(row.id)}">Delete</button></div></article>`).join('') || '<p class="muted">No readings yet.</p>'}</section>`;
}

function draw() {
  const canvas = document.querySelector('#chart');
  if (!canvas) return;
  const chartValue = value => selected === 'salt' && salinityUnit() === 'SG' && value !== null
    ? salinityToGravity(value) : value;
  const points = records(selected).slice(0,60).reverse().map(row => ({...row,value:chartValue(row.value)}));
  const target = config(selected);
  const low = chartValue(target.low), high = chartValue(target.high);
  const series = points.map(row => row.value);
  const min = Math.min(...series,...[low,high].filter(value => value !== null));
  const max = Math.max(...series,...[low,high].filter(value => value !== null));
  const pad = (max-min)*.12 || (selected === 'salt' && salinityUnit() === 'SG' ? .0001 : Math.max(Math.abs(max)*.04,.01));
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const {width,height} = canvas.getBoundingClientRect();
  const scale = window.devicePixelRatio || 1;
  canvas.width = width*scale;
  canvas.height = height*scale;
  ctx.scale(scale,scale);
  const top = 12, bottom = height-32;
  ctx.font = '12px system-ui';
  const ticks = Array.from({length:5},(_,i) => min-pad+i*(max-min+2*pad)/4);
  const tickLabel = value => selected === 'salt' ? format(Number(value.toFixed(3))) : format(Number(value.toPrecision(6)));
  const left = Math.max(45,...ticks.map(value => ctx.measureText(tickLabel(value)).width+10));
  const right = width-12;
  const y = value => bottom-(value-min+pad)/(max-min+2*pad)*(bottom-top);
  const dateStart = Date.parse(points[0].date);
  const dateEnd = Date.parse(points.at(-1).date);
  const x = row => dateEnd === dateStart ? (left+right)/2 : left+(Date.parse(row.date)-dateStart)/(dateEnd-dateStart)*(right-left);
  if (low !== null || high !== null) {
    const start = high === null ? top : y(high);
    ctx.fillStyle = '#193c3e';
    ctx.fillRect(left,start,right-left,(low === null ? bottom : y(low))-start);
  }
  let lastLabel;
  for (const value of ticks) {
    ctx.strokeStyle = '#32445a';
    ctx.beginPath(); ctx.moveTo(left,y(value)); ctx.lineTo(right,y(value)); ctx.stroke();
    ctx.fillStyle = '#a3b5ca';
    const label = tickLabel(value);
    if (label !== lastLabel) ctx.fillText(label,0,y(value)+4);
    lastLabel = label;
  }
  ctx.strokeStyle = '#48d8ee'; ctx.lineWidth = 2.5; ctx.beginPath();
  points.forEach((row,index) => index ? ctx.lineTo(x(row),y(row.value)) : ctx.moveTo(x(row),y(row.value)));
  ctx.stroke();
  ctx.fillStyle = '#48d8ee';
  for (const row of points) {
    ctx.beginPath(); ctx.arc(x(row),y(row.value),3.5,0,Math.PI*2); ctx.fill();
  }
  const shortDate = value => new Date(value).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  ctx.fillStyle = '#a3b5ca';
  ctx.fillText(shortDate(dateStart),left,bottom+22);
  if (dateEnd !== dateStart) {
    const label = shortDate(dateEnd);
    ctx.fillText(label,right-ctx.measureText(label).width,bottom+22);
  }
}

function urgentText({urgentLow,urgentHigh}) {

function localDate(value) {
  const date = new Date(value);
  return new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16);

const PHOTO_FIELDS = [
  ['alk',/^(?:D[ .-]*ALK|ALKALINITY|ALK|DKH)(?=\s|[:=])/i],
  ['salt',/^(?:SALINITY|SAL|SPECIFIC GRAVITY|SG)(?=\s|[:=])/i],
  ['ph',/^P\s*H(?=\s|[:=])/i],
  ['no3',/^(?:NITRATE|NO[3₃])(?!\s*-\s*N)(?=\s|[:=])/i],
  ['po4',/^(?:PHOSPHATE|PHOS|P[O0][4₄])(?!\s*-\s*P)(?=\s|[:=])/i],
  ['ca',/^(?:CALCIUM|CA)(?=\s|[:=])/i],
  ['mg',/^(?:MAGNESIUM|MG)(?=\s|[:=])/i],
  ['no2',/^(?:NITRITE|NO[2₂])(?!\s*-\s*N)(?=\s|[:=])/i],
  ['si',/^(?:SILICATE|SILICA|SIO[2₂])(?=\s|[:=])/i],
  ['nh3',/^(?:TOTAL AMMONIA|AMMONIA|AMMO|NH[3₃])(?!\s*-\s*N)(?=\s|[:=])/i]
];

function scanResults(text) {
  const readings = new Map();
  const ambiguous = new Set();
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim().replace(/^[|*•\\/]+\s*/,'');
    const entry = PHOTO_FIELDS.find(([,label]) => label.test(line));
    if (!entry) continue;
    const [key,pattern] = entry;
    const label = line.match(pattern)[0];
    const rest = line.slice(label.length).trim()
      .replace(/^\(\s*(?:NO[23₃₂]|PO[4₄]|Ca|Mg|NH[3₃](?:\s*[+/]\s*NH[4₄])?)\s*\)\s*/i,'');
    const match = rest.match(/^(?:\(\s*(ppm|mg\s*\/\s*l|ppt|psu|dkh|sg)\s*\)\s*)?[:=]?\s*(\d+(?:[.,]\s*\d+)?|[.,]\d+)\s*(ppm|mg\s*\/\s*l|ppt|psu|dkh|sg)?\s*[|]*$/i);
    if (!match) { ambiguous.add(key); continue; }
    const units = [match[1],match[3]].filter(Boolean).map(unit => unit.replace(/\s/g,'').toLowerCase());
    const gravity = key === 'salt' && (units.includes('sg') || /^(?:SG|SPECIFIC GRAVITY)$/i.test(label));
    const expected = key === 'alk' ? ['dkh'] : key === 'salt' ? (gravity ? ['sg'] : ['ppt','psu']) : key === 'ph' ? [] : ['ppm','mg/l'];
    if (units.some(unit => !expected.includes(unit)) ||
        (key === 'alk' && !units.length && !/^(?:D[ .-]*ALK|DKH)$/i.test(label))) {
      ambiguous.add(key);
      continue;
    }
    const measured = Number(match[2].replace(',','.').replace(/\s/g,''));
    const value = gravity ? parseSalinity(measured,'SG') : measured;
    const plausible = Number.isFinite(value) && value >= 0 &&
      (key !== 'ph' || value <= 14) &&
      (key !== 'salt' || (value >= 5 && value <= 80)) &&
      (key !== 'alk' || value <= 35);
    if (!plausible || (readings.has(key) && readings.get(key) !== value)) {
      ambiguous.add(key);
      continue;
    }
    readings.set(key,value);
  }
  for (const key of ambiguous) readings.delete(key);
  return {readings,ambiguous};
}

let photoEngine;
function getPhotoEngine() {
  if (photoEngine) return photoEngine;
  photoEngine = new Promise((resolve,reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js';
    script.onload = () => window.Tesseract?.createWorker ? resolve(window.Tesseract) : reject(Error('Scanner unavailable'));
    script.onerror = () => { script.remove(); reject(Error('Scanner unavailable')); };
    document.head.append(script);
  }).catch(error => { photoEngine = null; throw error; });
  return photoEngine;
}

async function photoCanvas(file) {
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const scale = Math.min(1,2200/Math.max(image.naturalWidth,image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1,Math.round(image.naturalWidth*scale));
    canvas.height = Math.max(1,Math.round(image.naturalHeight*scale));
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(image,0,0,canvas.width,canvas.height);
    return canvas;
  } finally { URL.revokeObjectURL(url); }
}

function detailCanvas(source,inset,enhance = true,magnify = 1) {
  const canvas = document.createElement('canvas');
  const x = Math.round(source.width*inset.left);
  const y = Math.round(source.height*inset.top);
  const sourceWidth = Math.round(source.width*(1-inset.left-inset.right));
  const sourceHeight = Math.round(source.height*(1-inset.top-inset.bottom));
  canvas.width = sourceWidth*magnify;
  canvas.height = sourceHeight*magnify;
  const ctx = canvas.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(source,x,y,sourceWidth,sourceHeight,0,0,canvas.width,canvas.height);
  if (!enhance) return canvas;
  const frame = ctx.getImageData(0,0,canvas.width,canvas.height);
  const {data,width,height} = frame;
  const integral = new Uint32Array((width+1)*(height+1));
  const levels = new Uint8Array(width*height);
  const stride = width+1;
  for (let row=0;row<height;row++) {
    let running=0;
    for (let col=0;col<width;col++) {
      const pixel=row*width+col;
      const offset=pixel*4;
      const level=Math.round(.299*data[offset]+.587*data[offset+1]+.114*data[offset+2]);
      levels[pixel]=level;
      running+=level;
      integral[(row+1)*stride+col+1]=running+integral[row*stride+col+1];
    }
  }
  const radius=Math.max(8,Math.round(Math.min(width,height)*.028));
  for (let row=0;row<height;row++) {
    const top=Math.max(0,row-radius),bottom=Math.min(height,row+radius+1);
    for (let col=0;col<width;col++) {
      const left=Math.max(0,col-radius),right=Math.min(width,col+radius+1);
      const sum=integral[bottom*stride+right]-integral[top*stride+right]-
        integral[bottom*stride+left]+integral[top*stride+left];
      const mean=sum/((right-left)*(bottom-top));
      const pixel=row*width+col;
      const value=levels[pixel]<mean-Math.max(17,mean*.12) ? 0 : 255;
      data[pixel*4]=data[pixel*4+1]=data[pixel*4+2]=value;
    }
  }
  ctx.putImageData(frame,0,0);
  return canvas;
}

function enablePhotoScan() {
  const status = form.querySelector('#photo-status');
  const photoButtons = [...form.querySelectorAll('[data-photo-picker]')];
  const saveButton = form.querySelector('button.primary');
  const transcript = form.querySelector('#photo-transcript');
  const previous = new Map();
  for (const button of photoButtons) {
    const picker = form.querySelector('#'+button.dataset.photoPicker);
    button.onclick = () => picker.click();
    picker.onchange = async () => {
      const file = picker.files[0];
      picker.value = '';
      if (!file) return;
      const current = () => dialog.open && status.isConnected;
      let worker;
      for (const control of [...photoButtons,saveButton]) control.disabled = true;
      status.textContent = 'Preparing the scanner…';
      transcript.hidden = true;
      transcript.open = false;
      try {
        const [engine,canvas] = await Promise.all([getPhotoEngine(),photoCanvas(file)]);
        if (!current()) return;
        worker = await engine.createWorker('eng',1,{logger:event => {
          if (current() && event.status === 'recognizing text') {
            status.textContent = 'Reading photo… '+Math.round(event.progress*100)+'%';
          }
        }});
        if (!current()) return;
        await worker.setParameters({tessedit_pageseg_mode:engine.PSM.SINGLE_BLOCK});
        async function recognize(image) {
          const {data} = await worker.recognize(image);
          return {...scanResults(data.text),text:data.text};
        }
        let result = await recognize(canvas);
        if (result.readings.size < 7 && current()) {
          status.textContent = 'Enhancing the photo…';
          const center = detailCanvas(canvas,{left:.10,top:.16,right:.10,bottom:.24});
          const enhanced = await recognize(center);
          if (enhanced.readings.size > result.readings.size) result = enhanced;
          if (result.readings.size < 7 && current()) {
            const slipArea = {left:.19,top:.372,right:.46,bottom:.414};
            const slip = await recognize(detailCanvas(canvas,slipArea,false,3));
            if (slip.readings.size >= 5 && slip.ambiguous.size && current()) {
              const contextArea = {left:.18,top:.27,right:.35,bottom:.40};
              const context = await recognize(detailCanvas(canvas,contextArea,false));
              if (context.readings.size >= 5) {
                for (const key of slip.ambiguous) {
                  if (!context.readings.has(key)) continue;
                  slip.readings.set(key,context.readings.get(key));
                  slip.ambiguous.delete(key);
                }
                slip.text += '\n\nWider scan\n' + context.text;
              }
            }
            if (slip.readings.size > result.readings.size) result = slip;
          }
          if (result.readings.size < 3 && current()) {
            await worker.setParameters({tessedit_pageseg_mode:engine.PSM.SPARSE_TEXT});
            const sparse = await recognize(detailCanvas(canvas,{left:0,top:0,right:0,bottom:0}));
            if (sparse.readings.size > result.readings.size || (!result.text.trim() && sparse.text.trim())) result = sparse;
          }
        }
        if (!current()) return;
        if (result.text.trim()) {
          transcript.querySelector('pre').textContent = result.text.trim().slice(0,2000);
          transcript.hidden = false;
        }
        let count = 0;
        for (const [key,value] of result.readings) {
          const field = form.elements.namedItem(key);
          if (!field || (field.value !== '' && field.value !== previous.get(key))) continue;
          field.value = String(displayParameterValue(key,value));
          field.dataset.scanned = '';
          previous.set(key,field.value);
          const details = field.closest('details');
          if (details) details.open = true;
          count++;
        }
        if (count) {
          status.textContent = 'Filled '+count+' reading'+(count===1?'':'s')+'. Check the highlighted numbers before saving.'+
            (result.ambiguous.size ? ' Some results need manual entry.' : '');
        } else if (result.readings.size) {
          status.textContent = 'The matching fields already have readings. Check them against the photo.';
        } else {
          status.textContent = 'No clear labeled readings found. Try a sharper photo or enter them manually.';
        }
      } catch {
        if (current()) status.textContent = 'Could not scan this photo. Try a JPG or PNG with a connection, or enter the readings manually.';
      } finally {
        if (worker) { try { await worker.terminate(); } catch {} }
        if (current()) for (const control of [...photoButtons,saveButton]) control.disabled = false;
      }
    };
  }
}

function logWaterChange() {
  const tankId = fleet.active;
  const planned = openTasks().find(task => task.kind === 'water');
  const now = new Date();
  const id = planned?.id ?? (crypto.randomUUID?.() ?? Date.now()+'-'+Math.random().toString(36).slice(2));
  const completed = {...(planned ?? {id,text:'Water change',kind:'water',reminder:null}),done:true,completedAt:now.toISOString()};
  try {
    save({...state,tasks:planned ? state.tasks.map(task => task.id === id ? completed : task) : [...state.tasks,completed]});
    render();
    main.querySelector('#task-message').textContent = 'Water change logged.';
  } catch {
    main.querySelector('#task-message').textContent = 'Could not log the water change.';
    return;
  }
  form.innerHTML = `<h2 id="entry-title">Next water change</h2>
    <p class="muted">Your water change was logged. When should we remind you again?</p>
    <div class="actions">${[7,14,21,30].map(days => `<button type="submit" name="interval" value="${days}" class="${days === planned?.repeatDays ? 'primary' : ''}">${days} days</button>`).join('')}</div>
    <p id="entry-error" role="alert"></p>
    <div><button type="button" id="cancel">No reminder</button></div>`;
  form.onsubmit = event => {
    event.preventDefault();
    const repeatDays = waterChangeInterval(event.submitter?.value);
    if (!repeatDays) return;
    const error = form.querySelector('#entry-error');
    if (fleet.active !== tankId || !state.tasks.some(task => task.id === id && task.done)) {
      error.textContent = 'The tank or water-change entry has changed.';
      return;
    }
    const reminderId = crypto.randomUUID?.() ?? Date.now()+'-'+Math.random().toString(36).slice(2);
    const reminder = waterChangeDate(now,repeatDays);
    try {
      save({...state,tasks:[...state.tasks,{id:reminderId,text:'Water change',kind:'water',done:false,reminder,repeatDays}]});
      dialog.close();
      render();
      main.querySelector('#task-message').textContent = 'Next water change scheduled.';
      main.querySelector('[data-log-water-change]')?.focus();
    } catch { error.textContent = 'Could not save the reminder.'; }
  };
  form.querySelector('#cancel').onclick = () => {
    dialog.close();
    main.querySelector('[data-log-water-change]')?.focus();
  };
  dialog.setAttribute('aria-labelledby','entry-title');
  dialog.showModal();
}

function scheduleRetest(dose) {
  const [,name] = parameter(dose.key);
  const tank = fleet.active;
  form.innerHTML = `<h2 id="entry-title">Schedule ${name.toLowerCase()} retest</h2>
    <label>Reminder date<input type="date" name="reminder" required min="${localDate(Date.now()).slice(0,10)}"></label>
    <p id="entry-error" role="alert"></p>
    <div class="actions"><button class="primary">Schedule retest</button><button type="button" id="cancel">Cancel</button></div>`;
  form.onsubmit = event => {
    event.preventDefault();
    const reminder = new FormData(form).get('reminder');
    if (!validTaskDate(reminder)) return;
    const error = form.querySelector('#entry-error');
    if (fleet.active !== tank || !state.doses.some(item => item.id === dose.id) ||
        state.tasks.some(task => task.doseId === dose.id && !task.done)) {
      error.textContent = 'This dose already has a retest task or is no longer available.';
      return;
    }
    try {
      const id = crypto.randomUUID?.() ?? Date.now()+'-'+Math.random().toString(36).slice(2);

function logDoseRetest(task) {
  const dose = state.doses.find(item => item.id === task.doseId);
  if (!dose || task.done) return;
  const tank = fleet.active;
  const [,name,unit] = parameter(dose.key);
  const openedAt = new Date();
  const initialDate = localDate(openedAt);
  form.innerHTML = `<h2 id="entry-title">Log ${name.toLowerCase()} retest</h2>
    <p class="muted">${esc(dose.brand)} · Dose logged ${dateText(dose.date)}</p>
    <label>Test date and time<input type="datetime-local" name="date" required value="${initialDate}"></label>
    <label>${name} (${unit})<input name="reading" type="number" step="any" min="0" required></label>
    <label>Notes<textarea name="note" rows="2" maxlength="1000"></textarea></label>
    <p id="entry-error" role="alert"></p>
    <div class="actions"><button class="primary">Save retest</button><button type="button" id="cancel">Cancel</button></div>`;
  form.onsubmit = event => {
    event.preventDefault();
    const data = new FormData(form);
    const testedAt = data.get('date') === initialDate ? openedAt : new Date(data.get('date'));
    const value = Number(data.get('reading'));
    const error = form.querySelector('#entry-error');
    if (!Number.isFinite(testedAt.getTime()) || testedAt.getTime() < Date.parse(dose.date)) {
      error.textContent = 'Choose a test time at or after the dose.';
      return;
    }
    if (data.get('reading') === '' || !Number.isFinite(value) || value < 0) return;
    if (fleet.active !== tank || !state.doses.some(item => item.id === dose.id) ||
        !state.tasks.some(item => item.id === task.id && !item.done)) {
      error.textContent = 'This retest task is no longer available.';
      return;
    }
    try {
      const id = crypto.randomUUID?.() ?? Date.now()+'-'+Math.random().toString(36).slice(2);
      const reading = {id,key:dose.key,value,date:testedAt.toISOString(),note:data.get('note').trim()};
      save({...state,readings:[...state.readings,reading],
        doses:state.doses.map(item => item.id === dose.id ? {...item,retestId:id} : item),
        tasks:state.tasks.map(item => item.id === task.id ? {...item,done:true} : item)});
      dialog.close();
      render();
      main.querySelector('#task-message').innerHTML = 'Retest saved to History. <button type="button" data-view="dosing">View dose comparison</button>';
    } catch { error.textContent = 'Could not save the retest.'; }
  };
  dialog.setAttribute('aria-labelledby','entry-title');
  form.querySelector('#cancel').onclick = () => dialog.close();
  dialog.showModal();
}

function showEntry(key,row) {
  const choices = PARAMETERS.map(([id]) => parameter(id));
  const field = ([id,name,unit]) => `<label>${name}${unit ? ' ('+unit+')' : ''}<input type="number" step="any" name="${id}"></label>`;
  const visible = choices.filter(([id]) => config(id).enabled || id === key);
  const optional = choices.filter(([id]) => !config(id).enabled && id !== key);
  const preselected = row?.key || key || choices[0][0];
  form.innerHTML = `<h2 id="entry-title">${row ? 'Edit water test' : 'Add water test'}</h2>
    <p class="muted">Tank · ${esc(state.name)}</p>
    <label>Test date and time<input type="datetime-local" name="date" required value="${localDate(row?.date ?? Date.now())}"></label>
    ${row ? `<label>Parameter<select name="parameter">${choices.map(([id,name,unit]) =>
      `<option value="${id}" ${id===preselected?'selected':''}>${name} ${unit}</option>`).join('')}</select></label>
      <label>Reading<input name="value" type="number" step="any" required value="${displayParameterValue(row.key,row.value)}"></label>` :
      `<div class="scan-panel stack">
        <h3>Scan test results</h3>
        <div class="actions">
          <button type="button" data-photo-picker="test-photo">Upload photo</button>
          <button type="button" data-photo-picker="test-camera">Take photo</button>

        <input id="test-camera" type="file" accept="image/*" capture="environment" hidden>
        <p class="muted" id="photo-status" role="status">Use a clear photo of printed results or a screenshot. The photo stays on your device.</p>
        <details hidden id="photo-transcript"><summary>View detected text</summary><pre></pre></details>
      </div>
      <p class="muted">Review any scanned numbers or enter readings directly. Leave the rest blank.</p>
      <div class="fields">${visible.map(field).join('')}</div>
      ${optional.length ? `<details class="extra-parameters"><summary>Other parameters</summary><div class="fields">${optional.map(field).join('')}</div></details>` : ''}`}
    <label>Notes<textarea name="note" rows="2" maxlength="1000">${esc(row?.note ?? '')}</textarea></label>
    <p class="alert" role="alert" id="entry-error"></p><div class="actions"><button class="primary">Save ${row ? 'reading' : 'readings'}</button>
    <button type="button" id="cancel">Cancel</button></div>`;
  dialog.setAttribute('aria-labelledby','entry-title');
  form.onsubmit = event => {
    event.preventDefault();
    const data = new FormData(form);
    const date = new Date(data.get('date')).toISOString();
    const note = data.get('note').trim();
    const input = row ? [[data.get('parameter'),data.get('value')]] : choices.map(([id]) => [id,data.get(id)]);
    const added = input.filter(([,value]) => value !== '').map(([id,value]) => ({
      id:row?.id ?? (crypto.randomUUID?.() ?? Date.now()+'-'+id+'-'+Math.random().toString(36).slice(2)),
      key:id,value:id !== 'salt' ? Number(value) : row?.key === 'salt' && Number(value) === salinityDisplay(row.value)
        ? row.value : parseSalinity(Number(value),salinityUnit()),date,note
    }));
    const error = form.querySelector('#entry-error');
    if (!added.length) { error.textContent = 'Enter at least one reading.'; return; }
    if (added.some(item => !Number.isFinite(item.value))) {
      error.textContent = 'Enter a valid salinity in ' + salinityUnit() + (salinityUnit() === 'SG' ? ', such as 1.026.' : ', such as 35.');
      return;
    }
    try {
      save({...state,readings:[...state.readings.filter(item => item.id !== row?.id),...added]});
      if (page === 'history' && row) selected = added[0].key;
      dialog.close();
      render();
    } catch { error.textContent = 'Could not save in this browser.'; }
  };
  form.querySelector('#cancel').onclick = () => dialog.close();
  if (!row) enablePhotoScan();
  dialog.showModal();
  if (!row && key) form.elements.namedItem(key)?.focus();
}

    catch { alert('Could not save the change in this browser.'); }
  }
  if (button.dataset.scheduleRetest) {

    if (dose) scheduleRetest(dose);

    if (task) logDoseRetest(task);
  }

main.addEventListener('submit',event => {
  if (event.target.id === 'task-form') {
    event.preventDefault();
    const form = event.target;
    const data = new FormData(form);
    const text = data.get('text').trim();
    const reminder = data.has('remind') ? data.get('reminder') : null;
    const message = main.querySelector('#task-message');
    if (!text) { message.textContent = 'Enter a task.'; return; }
    if (data.has('remind') && !validTaskDate(reminder)) {
      message.textContent = 'Choose a reminder date.';
      return;
    }
    const id = crypto.randomUUID?.() ?? Date.now()+'-'+Math.random().toString(36).slice(2);
    try {
      save({...state,tasks:[...state.tasks,{id,text:text.slice(0,240),reminder,done:false}]});
      render();
      main.querySelector('#task-message').textContent = 'Task added.';
      main.querySelector('#task-form textarea')?.focus();
    } catch { message.textContent = 'Could not save the task.'; }
    return;
  }
  if (event.target.id === 'salinity-units') {
    event.preventDefault();
    const unit = new FormData(event.target).get('salinityUnit');
    if (!['SG','ppt'].includes(unit)) return;
    try {
      save({...state,salinityUnit:unit});
      render();
      main.querySelector('#salinity-message').textContent = 'Salinity unit saved.';
    } catch { main.querySelector('#salinity-message').textContent = 'Could not save the salinity unit.'; }
    return;
  }
  if (event.target.id === 'dose-form') {
    event.preventDefault();
    const input = readDose(event.target);
    const dose = exactDoseStrength(input,doseProduct(input.brand));
    const message = main.querySelector('#dose-message');
    if (!state.waterVolume) {
      message.textContent = 'Set the tank’s water volume in Tanks first.';
      return;
    }
    if (!dose.brand || !validDose(dose)) {
      message.textContent = 'Enter a product name and positive values for the dose, strength and water volumes.';
      return;
    }
    const latest = records(dose.key)[0];
    const baseline = latest ? {value:latest.value,date:latest.date} : null;
    const id = crypto.randomUUID?.() ?? Date.now()+'-'+Math.random().toString(36).slice(2);
    try {
      const [entry] = validateDoses([{...dose,id,date:new Date().toISOString(),baseline}]);
      save({...state,doses:[entry,...state.doses]});
      event.target.elements.amount.value = '';
      render();
      main.querySelector('#dose-message').textContent = 'Dose logged.';
    } catch { message.textContent = 'Could not save this dose. Check the entered values and try again.'; }
    return;
  }
  if (event.target.id === 'shared-signup') {
    event.preventDefault();
    void signUpWithSharedInvite(event.target);
    return;
  }
  if (event.target.id === 'set-password') {
    event.preventDefault();
    void setAccountPassword(event.target);
    return;
  }
  if (event.target.id === 'email-signin') {
    event.preventDefault();
    void signInWithEmail(event.target);
    return;
  }
  if (event.target.dataset?.volumeTank) {
    event.preventDefault();
    const form = event.target;
    const message = form.querySelector('[role=status]');
    let details;
    try { details = readTankDetails(new FormData(form)); }
    catch (error) { message.textContent = error.message; return; }
    try {
      saveFleet({...fleet,tanks:fleet.tanks.map(tank => tank.id === form.dataset.volumeTank ?
        {...tank,log:{...tank.log,...details}} : tank)});
      const facts = main.querySelector('[data-tank-facts="' + CSS.escape(form.dataset.volumeTank) + '"]');
      if (facts) facts.innerHTML = tankFacts(details);
      message.textContent = 'Tank details saved.';
    } catch { message.textContent = 'Could not save the tank details. Try again.'; }
    return;
  }
  if (event.target.id === 'tank-form') {
    event.preventDefault();
    const data = new FormData(event.target);
    const name = data.get('name').trim();
    const message = document.querySelector('#tank-message');
    if (!name) { message.textContent = 'Enter a tank name.'; return; }
    let details;
    try { details = readTankDetails(data); }
    catch (error) { message.textContent = error.message; return; }
    const id = crypto.randomUUID?.() ?? Date.now()+'-'+Math.random().toString(36).slice(2);
    try { activate({...fleet,active:id,tanks:[...fleet.tanks,{id,log:{...defaults(),name,...details}}]}); }
    catch { message.textContent = 'Could not save the tank in this browser.'; }
    return;
  }
  if (event.target.id !== 'targets-form') return;
  event.preventDefault();
  const data = new FormData(event.target);
  const message = document.querySelector('#settings-message');
  const settings = {};
  const number = key => data.get(key) === '' ? null : Number(data.get(key));
  for (const [key,label] of PARAMETERS) {
    const preset = profileTarget(key);
    const current = config(key);
    const targetBound = bound => {
      const value = number(key+'-'+bound);
      if (key !== 'salt' || value === null) return value;
      if (value === displayParameterValue(key,current[bound])) return current[bound];
      if (value === displayParameterValue(key,preset[bound])) return preset[bound];
      return parseSalinity(value,salinityUnit());
    };
    const low = targetBound('low'), high = targetBound('high');
    if ([low,high].some(Number.isNaN)) {
      message.textContent = 'Enter a valid salinity target in ' + salinityUnit() + '.';
      return;
    }
    if (low !== null && high !== null && low > high) {
      message.textContent = label + ' minimum must be at or below its maximum.';
      event.target.elements.namedItem(key+'-low').focus();
      return;
    }
    const custom = (low !== null || high !== null) && (low !== preset.low || high !== preset.high);
    settings[key] = {enabled:data.has(key+'-enabled'),low,high,days:number(key+'-days'),custom};
  }
  try {
    save({...state,settings});
    render();
    document.querySelector('#settings-message').textContent = 'Targets saved.';
  } catch { message.textContent = 'Could not save the targets in this browser.'; }
});

main.addEventListener('change',async event => {
  const control = event.target;
  if (control.id === 'overview-tank') {
    const id = control.value;
    if (id === fleet.active || !fleet.tanks.some(tank => tank.id === id)) return;
    try {
      activate({...fleet,active:id});
      main.querySelector('#overview-tank')?.focus();
    } catch {
      control.value = fleet.active;
      alert('Could not switch tanks. Try again.');
    }
    return;
  }
  if (control.form?.id === 'task-form' && control.name === 'remind') {
    const reminder = control.form.elements.namedItem('reminder');
    main.querySelector('#task-reminder-date').hidden = !control.checked;
    reminder.disabled = !control.checked;
    reminder.required = control.checked;
    return;
  }
  if (control.dataset?.task) {
    const id = control.dataset.task;
    const task = state.tasks.find(item => item.id === id);
    if (!task || task.doseId || task.kind === 'water') return;
    const message = main.querySelector('#task-message');
    try {
      save({...state,tasks:state.tasks.map(item => item.id === id ? {...item,done:control.checked} : item)});
      refreshTaskLists();
      main.querySelector('[data-task="' + CSS.escape(id) + '"]')?.focus();
      message.textContent = control.checked ? 'Task completed.' : 'Task reopened.';
    } catch {
      control.checked = task.done;
      message.textContent = 'Could not update the task.';
    }
    return;
  }
  if (event.target.id === 'history-filter') { selected=event.target.value; render(); document.querySelector('#history-filter').focus(); }
  if (event.target.id !== 'backup') return;
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const message = document.querySelector('#backup-message');
  let restored;
  try { restored = validateFleet(JSON.parse(await file.text())); }
  catch { message.textContent = 'This file is not a valid Reef Log backup.'; return; }
  if (!confirm('Replace all tanks, readings, and targets in this browser with the backup?')) return;
  try { saveFleet(restored); render(); document.querySelector('#backup-message').textContent = 'Backup restored.'; }
  catch { message.textContent = 'Could not restore the backup in this browser.'; }
});

function emptyFleet() {
  return {version:2,active:'first',tanks:[{id:'first',log:defaults()}]};
}

function browserFleet() {
  const saved = localStorage.getItem(STORAGE);
  return saved ? validateFleet(JSON.parse(saved)) : emptyFleet();

function hasBrowserLog() {

}

function cacheCloud(current,log,version,pending) {
  localStorage.setItem(STORAGE + ':cloud:' + current.id,JSON.stringify({log,version,pending}));
}

async function loadCloud(current,discardPending = false) {
  const {data,error} = await cloudClient.from('reef_log_books')
    .select('version,log').eq('owner_id',current.id).maybeSingle();
  if (error) throw error;
  if (cloud !== current || (current.pending && !discardPending)) return;
  const changed = discardPending || !current.ready || current.version !== (data?.version ?? null);
  const log = data ? validateFleet(data.log) : emptyFleet();
  cacheCloud(current,log,data?.version ?? null,false);
  current.ready = true;
  current.version = data?.version ?? null;
  current.message = data ? 'Synced with your account.' :
    'Your cloud log is empty. You can import this browser’s log or add a new reading.';
  if (changed) {
    showFleet(log);
    if (!dialog.open && !renameDialog.open && !main.querySelector('form:focus-within')) render();
  }
}

async function syncCloud(current) {
  if (cloud !== current || current.busy || current.conflict) return;
  current.busy = true;
  const startedPending = current.pending;
  try {
    if (!current.pending) {
      if (!dialog.open && !renameDialog.open && !main.querySelector('form:focus-within')) await loadCloud(current);
      return;
    }
    while (cloud === current && current.pending) {
      const snapshot = fleet;
      const nextVersion = crypto.randomUUID();
      const row = {owner_id:current.id,version:nextVersion,log:snapshot};
      const table = cloudClient.from('reef_log_books');
      const result = current.version ? await table.update(row).eq('owner_id',current.id)
        .eq('version',current.version).select('version').maybeSingle() :
        await table.insert(row).select('version').single();
      if (cloud !== current) return;
      if (result.error?.code === '23505' || (!result.data && !result.error)) {
        current.conflict = true;
        current.message = 'The cloud log changed on another device. Export this device’s log before loading the cloud version.';
        return;
      }
      if (result.error) throw result.error;
      current.version = nextVersion;
      current.pending = fleet !== snapshot;
      cacheCloud(current,fleet,current.version,current.pending);
      current.message = 'Saved to your account.';
    }
  } catch(error) {
    current.message = error?.code === '42501' ?
      'This account does not have access to Reef Log cloud storage.' :
      'Sync is unavailable. Changes saved on this device can be retried from Account.';
  } finally {
    current.busy = false;
    if (cloud === current) {
      if (!main.querySelector('#set-password:focus-within')) refreshAccount();
      if (!startedPending && current.pending) void syncCloud(current);
    }
  }
}

async function changeSession(user) {
  if ((user?.id ?? null) === (cloud?.id ?? null)) return;
  dialog.close();
  renameDialog.close();
  if (!user) {
    cloud = undefined;
    try { showFleet(browserFleet()); }
    catch { showFleet(emptyFleet()); }
    render();
    return;
  }
  const current = cloud = {id:user.id,email:user.email ?? 'your account',ready:false,version:null,pending:false,busy:false,conflict:false,message:'Loading your cloud log…'};
  showFleet(emptyFleet());
  try {
    const cached = JSON.parse(localStorage.getItem(STORAGE + ':cloud:' + current.id) ?? 'null');
    if (cached) {
      showFleet(validateFleet(cached.log));
      current.version = cached.version;
      current.pending = cached.pending === true;
      current.ready = true;
    }
  } catch { current.message = 'The cached log could not be opened.'; }
  render();
  await syncCloud(current);
  void loadShareLink(current);
}

async function loadShareLink(current) {
  try {
    const {data} = await cloudClient.auth.getSession();
    if (data.session?.user.id !== current.id || cloud !== current) return;
    const result = await fetch(CLOUD_URL + '/functions/v1/reef-log-share',{
      method:'POST',headers:{apikey:CLOUD_KEY,Authorization:'Bearer ' + data.session.access_token},
      cache:'no-store'
    });
    if (!result.ok || cloud !== current) return;
    const {link} = await result.json();
    if (cloud !== current || typeof link !== 'string' || !link.startsWith(REEF_URL + '#join=')) return;
    current.shareLink = link;
    if (!main.querySelector('form:focus-within')) refreshAccount();
  } catch { /* The invite controls are optional, so account sync remains available. */ }
}

async function copyInviteLink() {
  if (!cloud?.shareLink) return;
  const status = document.querySelector('#invite-copy-status');
  try {
    await navigator.clipboard.writeText(cloud.shareLink);
    status.textContent = 'Invite link copied.';
  } catch {
    document.querySelector('#invite-link-label').hidden = false;
    const input = document.querySelector('#invite-link');
    input.focus();
    input.select();
    status.textContent = 'Copy the selected invite link.';
  }
}

function finishSharedInvite() {
  sharedInvite = null;
  if (new URLSearchParams(location.hash.slice(1)).has('join')) {
    window.history.replaceState(null,'',location.pathname + location.search);
  }
}

async function signUpWithSharedInvite(form) {
  const data = new FormData(form);
  const email = data.get('email').trim();
  const password = data.get('password');
  const button = form.querySelector('button');
  const status = document.querySelector('#cloud-status');
  const invite = sharedInvite;
  if (!invite) return;
  button.disabled = true;
  status.textContent = 'Creating your account…';
  try {
    if (!cloudClient) throw Error('Sign-up is loading. Try again in a moment.');
    const response = await fetch(CLOUD_URL + '/functions/v1/reef-log-join',{
      method:'POST',
      headers:{apikey:CLOUD_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({invite,email,password})
    });
    const result = await response.json();
    if (!response.ok || !result.created) throw Error(result.error || 'Could not create the account.');
    const {error} = await cloudClient.auth.signInWithPassword({email,password});
    finishSharedInvite();
    authMessage = error ? 'Account created. Sign in with the email and password you just set.' : '';
    refreshAccount();
  } catch(error) {
    authMessage = error?.message || 'Could not create the account. Try again.';
    status.textContent = authMessage;
  } finally {
    button.disabled = false;
  }
}

async function signInWithEmail(form) {
  const data = new FormData(form);
  const button = form.querySelector('button');
  button.disabled = true;
  try {
    if (!cloudClient) throw Error('Authentication unavailable');
    const {error} = await cloudClient.auth.signInWithPassword({
      email:data.get('email').trim(),password:data.get('password')
    });
    if (error) throw error;
  } catch(error) {
    authMessage = error?.status === 429 ? 'Too many attempts. Wait a minute and try again.' :
      'Sign-in failed. Check your invited email and password.';
    refreshAccount();
  } finally { button.disabled = false; }
}

function setPasswordSetup(userId,type = 'recovery') {
  passwordSetupUser = userId;
  passwordSetupType = type;
  try {
    if (userId) sessionStorage.setItem(PASSWORD_SETUP_KEY,type === 'invite' ? 'invite:' + userId : userId);
    else sessionStorage.removeItem(PASSWORD_SETUP_KEY);
  } catch { /* Keep the current-page state if session storage is unavailable. */ }
}

async function setAccountPassword(form) {
  const current = cloud;
  if (!current || passwordSetupUser !== current.id) return;
  const button = form.querySelector('button');
  button.disabled = true;
  try {
    const {error} = await cloudClient.auth.updateUser({password:new FormData(form).get('password')});
    if (error) throw error;
    setPasswordSetup(null);
    current.message = 'Password saved. Use your email and password next time.';
  } catch {
    current.passwordMessage = 'Could not save that password. Try again.';
  } finally {
    button.disabled = false;
    if (cloud === current) refreshAccount();
  }
}

async function redeemInvite(token,type) {
  try {
    const {data,error} = await cloudClient.auth.verifyOtp({token_hash:token,type});
    if (error || !data.user) throw error ?? Error('Missing verified account');
    setPasswordSetup(data.user.id,type);
    authMessage = '';
  } catch {
    authMessage = 'This link has expired or was already used. Ask for a new link.';
  }
  refreshAccount();
}

async function accountAction(action) {
  try {
    if (action === 'copy-invite') await copyInviteLink();
    if (action === 'show-signin') {
      finishSharedInvite();
      authMessage = '';
      refreshAccount();
    }
    if (action === 'signout') {
      if (cloud?.busy) { cloud.message = 'Wait for the current sync before signing out.'; refreshAccount(); return; }
      const {error} = await cloudClient.auth.signOut({scope:'local'});
      if (error) throw error;
      setPasswordSetup(null);
    }
    if (action === 'import' && cloud?.ready && !cloud.version && !cloud.pending) {
      saveFleet(browserFleet());
      refreshAccount();
    }
    if (action === 'sync' && cloud) await syncCloud(cloud);
    if (action === 'reload' && cloud?.conflict &&
        confirm('Replace this device’s unsynced cloud copy with the latest cloud log?')) {
      const current = cloud;
      await loadCloud(current,true);
      if (cloud !== current) return;
      cloud.pending = false;
      cloud.conflict = false;
      refreshAccount();
    }
  } catch {
    if (cloud) cloud.message = 'That action could not be completed. Please try again.';
    else authMessage = 'Sign-in is unavailable. Please try again.';
    refreshAccount();
  }
}

document.addEventListener('keydown',event => {
  const menu = document.querySelector('#settings-menu');
  if (event.key === 'Escape' && menu?.open) {
    menu.open = false;
    menu.querySelector('summary').focus();
  }
});
window.addEventListener('resize',draw);
window.addEventListener('online',() => { if (cloud) void syncCloud(cloud); });
window.addEventListener('focus',() => { if (cloud) void syncCloud(cloud); });
render();
if (location.href.startsWith(REEF_URL)) {
  const authParams = new URL(location.href).searchParams;
  function readInviteLink() {
    const link = new URLSearchParams(location.hash.slice(1));
    const token = link.get('token_hash');
    const type = link.get('type');
    if (!/^[A-Za-z0-9_-]{40,128}$/.test(token ?? '') || !['invite','recovery'].includes(type)) return null;
    window.history.replaceState(null,'',location.pathname + location.search);
    authMessage = 'Checking your invitation…';
    page = 'account';
    render();
    return {token,type};
  }
  function openSharedInvite() {
    const invite = new URLSearchParams(location.hash.slice(1)).get('join');
    if (!/^[A-Za-z0-9_-]{43}$/.test(invite ?? '')) return;
    sharedInvite = invite;
    authMessage = '';
    page = 'account';
    render();
  }
  openSharedInvite();
  let invitation = readInviteLink();
  if (!invitation && (authParams.has('code') || authParams.has('error'))) {
    authMessage = 'Opening your account…';
    page = 'account';
    render();
  }
  window.addEventListener('hashchange',() => {
    openSharedInvite();
    const next = readInviteLink();
    if (!next) return;
    invitation = next;
    if (cloudClient) void redeemInvite(next.token,next.type);
  });
  import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.1/+esm').then(({createClient}) => {
    cloudClient = createClient(CLOUD_URL,CLOUD_KEY,{auth:{
      flowType:'pkce',storageKey:'reef-log-github-auth',persistSession:true,detectSessionInUrl:true
    }});
    cloudClient.auth.onAuthStateChange((_event,session) => {
      setTimeout(() => void changeSession(session?.user),0);
    });
    if (invitation) void redeemInvite(invitation.token,invitation.type);
  }).catch(() => {
    authMessage = 'Cloud sign-in could not load. Your browser log is available.';
    refreshAccount();
  });
}
</script>

</body>
</html>
