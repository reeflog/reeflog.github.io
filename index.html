<html lang="en">
<head>

<title>Reef Log</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#132c32;background:#eef5f3;--ink:#132c32;--muted:#506970;--line:#d5e5e1;--teal:#087667}
*{box-sizing:border-box}
body{margin:0} header{background:#0b2930;color:#fff} .bar,main{max-width:1080px;margin:auto;padding-inline:clamp(16px,4vw,38px)}
.bar{min-height:75px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:10px}
.brand{font-weight:800;font-size:1.35rem;letter-spacing:-.04em}.brand span{color:#70ddc7}
nav,.actions,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:8px 13px;font-weight:650}
button:hover{filter:brightness(.95)} button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #37a99b;outline-offset:2px}
nav button{background:transparent;color:white;border-color:#47636a}nav button[aria-current]{background:#23464d}
.primary{background:var(--teal);color:white;border-color:transparent}
main{padding-block:30px 54px}.hero{background:#d6eee8;border:1px solid #c3e1da;border-radius:22px;padding:clamp(20px,5vw,42px);display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1,h2,h3,p{margin:0}h1{font-size:clamp(2rem,6vw,3.7rem);letter-spacing:-.065em;line-height:1.05}h2{font-size:1.45rem;letter-spacing:-.035em}h3{font-size:1rem}.hero p{margin-top:10px;color:#365b5d}
section+section{margin-top:24px}.section-head{margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,225px),1fr));gap:12px}
.card,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:16px}.card{display:grid;gap:7px;align-content:start}.card button{justify-self:start;margin-top:4px}
.value{font-size:1.85rem;font-weight:750;letter-spacing:-.05em}.unit,.muted{font-size:.9rem;color:var(--muted);letter-spacing:normal}.unit{font-weight:500}
.pill{justify-self:start;border-radius:30px;padding:3px 10px;font-size:.88rem;font-weight:700;background:#eef3f4;color:#35525b}.good{background:#d9f4e9;color:#155643}.warn{background:#fff0d6;color:#7d4300}.attention{display:grid;gap:10px}
.indicator{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.dot{width:12px;height:12px;border-radius:50%;background:#78929a;flex:none}
.dot.green{background:#08845e}.dot.yellow{background:#c68a00}.dot.red{background:#c4353c}
.next-step{border-top:1px solid var(--line);padding-top:9px;margin-top:3px;font-size:.9rem;color:var(--muted)}
label{display:grid;gap:5px;font-size:.9rem;font-weight:650} input,select,textarea{width:100%;min-width:0;border:1px solid #b6cdca;padding:8px;border-radius:8px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto}.check{display:flex;align-items:center;gap:8px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,135px),1fr));gap:12px}.settings-row{padding:13px 0;border-top:1px solid var(--line);display:grid;gap:9px}.stack{display:grid;gap:14px}
.chart{width:100%;height:245px;display:block;margin-block:12px}.history article{border-top:1px solid var(--line);padding:11px 0;display:flex;justify-content:space-between;align-items:start;gap:10px}.note{white-space:pre-wrap;overflow-wrap:anywhere}
dialog{width:min(94vw,580px);max-height:90dvh;border:1px solid var(--line);border-radius:18px;padding:22px;color:var(--ink)}dialog::backdrop{background:#061f27a8}.alert{color:#8a321d;font-weight:650}.footer{margin-top:25px;color:var(--muted);font-size:.9rem}
@media(max-width:550px){.bar{align-items:flex-start}.bar nav{width:100%}.history article{flex-wrap:wrap}}
/* Dark dashboard theme */
:root{color-scheme:dark;color:#edf5fc;background:#0a101c;--ink:#edf5fc;--muted:#a3b5ca;--line:#2a3a51;--teal:#48d8ee}
header{background:#101827;border-bottom:1px solid var(--line)}
.brand span{color:#55dbed}
nav button{color:#b4c5d7;border-color:transparent}
nav button[aria-current]{background:#153744;color:#71e5f2;border-color:#265565}
button,input,select,textarea{background:#141f30;color:var(--ink);border-color:#364962}
.primary{background:#48d8ee;color:#06222c}
.hero{position:relative;background:radial-gradient(ellipse at 93% 105%,#174e63 0%,transparent 65%),linear-gradient(120deg,#172738,#101727);border-color:#2a455a}
.hero p{color:#b0c7da}
.card,.panel,dialog{background:#121c2b;border-color:var(--line)}
.card h3{color:#b9c9db}
.pill{background:#273548;color:#d5e4f0}
.good{background:#183b35;color:#83e8ba}

dialog::backdrop{background:#020611bf}
@media(max-width:600px){
  .bar{min-height:58px}
  .bar nav{position:fixed;bottom:0;left:0;right:0;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:#101827;border-top:1px solid var(--line);padding:7px 5px max(7px,env(safe-area-inset-bottom))}
  nav button{padding:9px 3px;font-size:.83rem}
  main{padding-bottom:86px}
}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary>div{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#121c2b;border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:.88rem}
.summary strong{font-size:1.25rem}
.reading-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.reading-card{gap:10px;border-left:3px solid #3d5066}
.reading-card[data-status=red]{border-left-color:#ff6c79}
.reading-card[data-status=yellow]{border-left-color:#f7c754}
.reading-card[data-status=green]{border-left-color:#4dd99b}
.reading-head,.reading-meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.reading-head h3{color:var(--ink)}
.reading-meta{font-size:.84rem;color:var(--muted)}
.reading-card .value{font-size:2.2rem;line-height:1.1}
.reading-card .indicator{font-size:.82rem}
.reading-card .next-step{margin:0}
.source-links{display:grid;gap:8px}.source-links a{color:#71e5f2}
@media(max-width:460px){.summary>div{padding:8px;column-gap:6px}.summary>div>span:last-child{width:100%;font-size:.78rem}.reading-grid{grid-template-columns:1fr}}
.tank-actions{margin-top:7px;padding-top:9px;border-top:1px solid var(--line)}
.danger{color:#ffadb7;border-color:#714052}
.danger:hover{background:#422633}

.settings-menu{position:relative}
.settings-menu summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border-radius:9px;padding:8px 12px;color:#b4c5d7;font-weight:650}
.settings-menu summary::-webkit-details-marker{display:none}
.settings-menu[open] summary,.settings-menu:has(button[aria-current]) summary{background:#153744;color:#71e5f2}
.settings-popover{position:absolute;right:0;top:calc(100% + 5px);z-index:5;display:grid;gap:3px;min-width:150px;padding:5px;background:#101827;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 22px #03061090}
.settings-popover button{text-align:left}
.profile-pills{display:flex;flex-wrap:wrap;gap:5px}
.profile-pills button{display:flex;align-items:center;gap:4px;border-radius:30px;padding:5px 8px;font-size:.82rem}
.profile-pills button svg{color:#9fbad5}
.profile-pills button[data-profile=soft] svg{color:#86dfbd}
.profile-pills button[data-profile=sps] svg{color:#c0afff}
.profile-pills button[aria-pressed=true]{border-color:#48d8ee;background:#153744;color:#b5f7ff}
.target-type button{font-size:.8rem;padding:3px 8px}
@media(max-width:600px){
 .settings-menu summary{padding:9px 2px;font-size:.83rem}
 .settings-popover{top:auto;bottom:calc(100% + 7px)}
 .settings-popover button{padding:9px 11px}
}

.invite-share{padding:15px;border:1px solid var(--line);border-radius:12px}.invite-share [hidden]{display:none}

.brand{border:0;background:transparent;padding:6px 0;color:#f1f7ff;letter-spacing:.055em;font-size:1.23rem;font-weight:850}
.brand:hover{color:#b5f7ff}
.profile-pills button{gap:6px;padding:5px 9px}
.profile-pills button svg{flex:none}
.scan-panel{padding:12px;border:1px solid var(--line);border-radius:12px;background:#142533;gap:8px}
.scan-panel [hidden]{display:none}
.extra-parameters summary{cursor:pointer;color:#b5c7d9;font-weight:650;margin-bottom:6px}
input[data-scanned]{border-color:#48d8ee}
</style>
</head>
<body>
<header><div class="bar"><button class="brand" type="button" data-view="overview" aria-label="REEFLABS home"><span>REEF</span>LABS</button><nav aria-label="Main navigation"><button data-view="overview">Overview</button><button data-view="tanks">Tanks</button><button data-view="history">History</button><details id="settings-menu" class="settings-menu"><summary aria-label="Settings">Settings</summary><div class="settings-popover"><button data-view="account">Account</button><button data-view="targets">Targets</button><button data-view="backup">Backup</button></div></details></nav></div></header>
<main id="main"></main>
<dialog id="entry"><form id="test-form" class="stack"></form></dialog>
<dialog id="rename-tank" aria-labelledby="rename-title">
  <form id="rename-form" class="stack">
    <h2 id="rename-title">Rename tank</h2>
    <label>Tank name<input name="name" required maxlength="60"></label>
    <p id="rename-error" class="alert" role="status"></p>
    <div class="actions"><button class="primary">Save name</button><button type="button" id="cancel-rename">Cancel</button></div>
  </form>
</dialog>
<script>
'use strict';
const PARAMETERS = [
  ['alk','Alkalinity','dKH'], ['salt','Salinity','ppt'], ['ph','pH',''],
  ['no3','Nitrate','ppm'], ['po4','Phosphate','ppm'],
  ['ca','Calcium','ppm'], ['mg','Magnesium','ppm'], ['no2','Nitrite','ppm'],
  ['si','Silicate','ppm'], ['nh3','Ammonia','ppm']
];
// Inclusive healthy limits. Urgent limits are conservative retest triggers.
const MIXED_REEF = {
  alk: {low:7.5,high:10,urgentLow:6,urgentHigh:13},
  salt:{low:34,high:36,urgentLow:32,urgentHigh:38},
  ph:  {low:7.8,high:8.4,urgentLow:7.7,urgentHigh:8.6},
  no3: {low:1,high:10,urgentHigh:50},
  po4: {low:.02,high:.12},
  ca:  {low:400,high:480,urgentLow:350,urgentHigh:550},
  mg:  {low:1250,high:1400,urgentLow:1100,urgentHigh:1650},
  no2: {low:null,high:.2},
  si:  {low:null,high:2},
  nh3: {low:null,high:.1,urgentHigh:.5}
};
const CORAL_PROFILES = {
  soft:{label:'Soft',ranges:{alk:[7.5,11],no3:[2,20],po4:[.03,.15],ca:[380,480],mg:[1250,1450]},
    icon:'<path fill="currentColor" fill-opacity=".26" d="M3 10C3 6 7 5 11 5s9 1 9 5c0 3-5 4-9 4s-8-1-8-4Zm4 10h10l-3-2-1-4h-3l-1 4Z"/><path d="M3 10c3 2 11 3 17 0M6 7V4m3 2V3m4 2V2m4 4V3m2 5 2-2"/>'},
  mixed:{label:'Mixed',ranges:{},
    icon:'<path d="M2 21h20M6 21v-8l-3-3m3 6 5-5V8M6 13V6" stroke-width="2"/><path fill="currentColor" fill-opacity=".27" d="M10 15c0-2 3-4 6-4s6 2 6 4c0 2-4 3-6 3s-6-1-6-3Zm4 6 1-3h2l1 3Z"/><path d="M13 13v-3m3 2V8m3 4V9"/>'},
  sps:{label:'SPS',ranges:{alk:[7.5,9],salt:[34.5,35.5],no3:[1,10],po4:[.02,.08],ca:[410,450],mg:[1280,1400]},
    icon:'<path d="M6 22h12m-6 0V12m0 4-6-4V7m0 5-3-2V7m3 2 3-3V3m3 11 5-4V6m0 4 4-3V4m-4 3-3-4V2m-2 18-5-2-3-3m8 5 6-4 3-1v-3" stroke-width="2.2"/>'}
};
const STORAGE = 'reef-log-v1';
const CLOUD_URL = 'https://gokemkztwbtuvyfsunml.supabase.co';
const CLOUD_KEY = 'sb_publishable_BsheAtrv4zxknsyu1ftgLw_-uiJhT3-';
const REEF_URL = 'https://reeflog.github.io/';
let cloudClient;
let cloud;
let authMessage = '';
let sharedInvite = null;
const PASSWORD_SETUP_KEY = 'reef-log-password-setup';
let passwordSetupUser = null;
let passwordSetupType = 'recovery';
try {
  const stored = sessionStorage.getItem(PASSWORD_SETUP_KEY);
  if (stored?.startsWith('invite:')) {
    passwordSetupType = 'invite';
    passwordSetupUser = stored.slice('invite:'.length);
  } else {
    passwordSetupUser = stored;
  }
}
catch { /* Password setup still works for the current page. */ }
const main = document.querySelector('#main');
const dialog = document.querySelector('#entry');
const form = document.querySelector('#test-form');
const renameDialog = document.querySelector('#rename-tank');
const renameForm = document.querySelector('#rename-form');
const defaults = () => ({version:1, name:'My reef', profile:'mixed', settings:{}, readings:[]});
let fleet = {version:2, active:'first', tanks:[{id:'first',log:defaults()}]};
let state = fleet.tanks[0].log;
let loadError = '';
try {
  const saved = localStorage.getItem(STORAGE);
  if (saved) {
    fleet = validateFleet(JSON.parse(saved));
    state = fleet.tanks.find(tank => tank.id === fleet.active).log;
  }
} catch {
  loadError = 'The saved log could not be opened. You can restore a backup from Settings > Backup.';
}
let page = 'overview';
let selected = 'alk';

function validateFleet(data) {
  if (data?.version === 1) return {version:2,active:'first',tanks:[{id:'first',log:validate(data)}]};
  if (data?.version !== 2 || !Array.isArray(data.tanks)) throw Error('Invalid backup');
  const ids = new Set();
  const tanks = data.tanks.map(tank => {
    if (!tank || typeof tank.id !== 'string' || !tank.id || ids.has(tank.id)) throw Error('Invalid tank');
    ids.add(tank.id);
    return {id:tank.id,log:validate(tank.log)};
  });
  if (!ids.has(data.active)) throw Error('Invalid active tank');
  return {version:2,active:data.active,tanks};
}

function validate(data) {
  if (data?.version !== 1 || typeof data.name !== 'string' || !data.name.trim() ||
      !Array.isArray(data.readings) || !data.settings || typeof data.settings !== 'object') throw Error('Invalid log');
  const settings = {};
  for (const [key] of PARAMETERS) {
    if (!Object.hasOwn(data.settings,key)) continue;
    const item = data.settings[key];
    if (!item || typeof item.enabled !== 'boolean' ||
        ![item.low,item.high].every(value => value === null || Number.isFinite(value)) ||
        (item.low !== null && item.high !== null && item.low > item.high) ||
        (item.days !== null && (!Number.isInteger(item.days) || item.days < 1 || item.days > 3650))) throw Error('Invalid target');
    settings[key] = {
      enabled:item.enabled,low:item.low,high:item.high,days:item.days,
      custom:typeof item.custom === 'boolean' ? item.custom : hasCustomTarget(key,item)
    };
  }
  const ids = new Set();
  const readings = data.readings.map(row => {
    if (!row || typeof row.id !== 'string' || !row.id || ids.has(row.id) ||
        (row.key !== 'temp' && !PARAMETERS.some(([key]) => key === row.key)) || !Number.isFinite(row.value) ||
        typeof row.note !== 'string' || !Number.isFinite(Date.parse(row.date))) throw Error('Invalid reading');
    ids.add(row.id);
    return {id:row.id,key:row.key,value:row.value,date:new Date(row.date).toISOString(),note:row.note};
  });
  return {version:1,name:data.name.trim().slice(0,60),profile:profileKey(data),settings,readings};
}
const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const format = value => Number(value).toLocaleString(undefined,{maximumFractionDigits:12});
const dateText = value => new Date(value).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
function profileKey(log) {
  return Object.hasOwn(CORAL_PROFILES,log.profile) ? log.profile : 'mixed';
}

function profileTarget(key,log = state) {
  const mixed = MIXED_REEF[key];
  const bounds = CORAL_PROFILES[profileKey(log)].ranges[key];
  return bounds ? {...mixed,low:bounds[0],high:bounds[1]} : mixed;
}

function hasCustomTarget(key,setting) {
  return (setting.low !== null || setting.high !== null) &&
    (setting.low !== MIXED_REEF[key].low || setting.high !== MIXED_REEF[key].high);
}

function config(key) {
  const stored = state.settings[key];
  const profile = profileTarget(key);
  const custom = stored && (stored.custom ?? hasCustomTarget(key,stored));
  return {
    enabled: stored?.enabled ?? !['no2','si'].includes(key),
    low: custom ? stored.low : profile.low,
    high: custom ? stored.high : profile.high,
    custom: Boolean(custom),
    days: stored?.days ?? null,
    urgentLow:profile.urgentLow,
    urgentHigh:profile.urgentHigh
  };
}
const records = key => state.readings.filter(row => row.key === key).sort((a,b) => b.date.localeCompare(a.date));
const active = () => PARAMETERS.filter(([key]) => config(key).enabled);
const parameter = key => PARAMETERS.find(item => item[0] === key);

function saveFleet(next) {
  if (cloud) {
    if (!cloud.ready) throw Error('Cloud log is still loading');
    cacheCloud(cloud,next,cloud.version,true);
    cloud.pending = true;
  } else {
    localStorage.setItem(STORAGE,JSON.stringify(next));
  }
  showFleet(next);
  loadError = '';
  if (cloud) void syncCloud(cloud);
}

function showFleet(next) {
  fleet = next;
  state = fleet.tanks.find(tank => tank.id === fleet.active).log;
}

function save(next) {
  saveFleet({...fleet,tanks:fleet.tanks.map(tank => tank.id === fleet.active ? {...tank,log:next} : tank)});
}

function renameTank(tankId,name) {
  saveFleet({...fleet,tanks:fleet.tanks.map(tank => tank.id === tankId ?
    {...tank,log:{...tank.log,name}} : tank)});
}

function removeTank(tankId) {
  const remaining = fleet.tanks.filter(tank => tank.id !== tankId);
  if (!remaining.length) remaining.push({id:'first',log:defaults()});
  saveFleet({...fleet,active:fleet.active === tankId ? remaining[0].id : fleet.active,tanks:remaining});
}

function activate(next) {
  saveFleet(next);
  selected = 'alk';
  page = 'overview';
  render();
  window.scrollTo(0,0);
}

function range({low,high},unit) {
  if (low === null && high === null) return 'Target unset';
  const bounds = low === null ? '≤ ' + format(high) : high === null ? '≥ ' + format(low) : format(low) + '–' + format(high);
  return 'Target ' + bounds + (unit ? ' ' + unit : '');
}

function assess(reading,{low,high,days,urgentLow,urgentHigh}) {
  if (!reading) return {label:'No reading',color:'gray',due:false,direction:''};
  const {value} = reading;
  const urgentDirection = urgentLow !== undefined && value <= urgentLow ? 'Below' : urgentHigh !== undefined && value >= urgentHigh ? 'Above' : '';
  const direction = urgentDirection || (low !== null && value < low ? 'Below' : high !== null && value > high ? 'Above' : '');
  const due = days !== null && Date.now() - Date.parse(reading.date) >= days * 86400000;
  if (urgentDirection) return {label:'Fix immediately',color:'red',due,direction};
  if (direction || due) return {label:'Needs attention',color:'yellow',due,direction};
  return {label:'Healthy',color:'green',due,direction:''};
}

function render() {
  document.querySelectorAll('[data-view]').forEach(button => {
    if (button.dataset.view === page) button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  });
  main.innerHTML = (loadError ? '<p class="alert" role="alert">' + esc(loadError) + '</p>' : '') +
    ({overview,history:historyView,targets,backup,tanks,account}[page])() +
    (cloud ? '<p class="footer">Manage cloud sync and backups in Settings.</p>' :
    '<p class="footer">Your log is stored in this browser. Sign in from Settings to sync across devices.</p>');
  if (page === 'history') draw();
}

function coralIcon(type) {
  return `<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${CORAL_PROFILES[type].icon}</svg>`;
}

function setTankProfile(id,profile) {
  if (!Object.hasOwn(CORAL_PROFILES,profile)) return;
  saveFleet({...fleet,tanks:fleet.tanks.map(tank => tank.id === id ?
    {...tank,log:{...tank.log,profile}} : tank)});
}

function tanks() {
  return `<section class="stack"><h1>Tanks</h1>
    <div class="grid">${fleet.tanks.map(tank => `<article class="card"><h3>${esc(tank.log.name)}</h3>
      ${tank.id === fleet.active ? '<span class="pill good">Active tank</span>' :
      `<button data-tank="${esc(tank.id)}">Switch to this tank</button>`}
      <div class="profile-pills" role="group" aria-label="Coral profile for ${esc(tank.log.name)}">
      ${Object.entries(CORAL_PROFILES).map(([type,profile]) => `<button data-profile="${type}" data-profile-tank="${esc(tank.id)}" aria-pressed="${type===profileKey(tank.log)}">${coralIcon(type)}${profile.label}</button>`).join('')}
      </div>
      <div class="actions tank-actions"><button data-rename="${esc(tank.id)}" aria-label="Rename ${esc(tank.log.name)}">Rename</button>
      <button class="danger" data-remove-tank="${esc(tank.id)}" aria-label="Delete ${esc(tank.log.name)}">Delete</button></div></article>`).join('')}</div>
    <form id="tank-form" class="panel stack"><h2>Add a tank</h2>
      <label>Tank name<input name="name" required maxlength="60"></label>
      <div><button class="primary">Add tank</button></div><p id="tank-message" role="status"></p>
    </form></section>`;
}

const NEXT_STEPS = {
  alk:['Check dosing and recent consumption before gradually adjusting alkalinity.','Check recent alkalinity doses and review the dosing schedule.'],
  salt:['Verify the meter calibration and check for excess freshwater top-off.','Verify the meter calibration and check whether freshwater top-off is working.'],
  ph:['Check alkalinity, aeration, and the time of day the sample was taken.','Check the meter calibration and review any recent kalkwasser or buffer dosing.'],
  no3:['Review feeding and nutrient removal before making gradual changes.','Review feeding, detritus buildup, and nutrient removal.'],
  po4:['Review phosphate-removing media and feeding.','Review feeding, source water, and phosphate removal.'],
  ca:['Check salinity and calcium dosing before adjusting.','Check salinity and recent calcium doses.'],
  mg:['Check salinity and verify the result before adjusting magnesium dosing.','Check salinity and any recent magnesium additions.'],
  no2:['Check the reading against the target you set.','Retest ammonia and check for recent changes to biological filtration.'],
  si:['Review the minimum target you set for this tank.','Test your source and top-off water for silicate.'],
  nh3:['Review the minimum target you set for this tank.','Retest promptly and check biological filtration and decaying material.']

function nextStep(item) {
  if (item.color === 'red') {
    const cutoff = item.direction === 'Below' ? item.setting.urgentLow : item.setting.urgentHigh;
    return 'Urgent ' + (item.direction === 'Below' ? 'low' : 'high') + ' reading. Retest now (cutoff ' + format(cutoff) + '). If confirmed, check livestock and address the cause promptly. ' +
      NEXT_STEPS[item.key][item.direction === 'Below' ? 0 : 1];
  }
  if (item.key === 'nh3' && item.direction && /FX203/i.test(item.reading.note) && item.reading.value <= .2) {
    return 'Above the total ammonia target and near this kit’s detection limit. Confirm with a fresh sample and a suitable low-range test.';
  }
  if (item.direction) {
    const bound = item.direction === 'Below' ? item.setting.low : item.setting.high;
    return item.direction + ' target of ' + format(bound) + (item.unit ? ' ' + item.unit : '') + '. Retest to confirm. ' +
      NEXT_STEPS[item.key][item.direction === 'Below' ? 0 : 1];
  }
  if (item.due) return 'The last test is overdue. Log a fresh reading.';
  return '';
}

function draw() {
  const canvas = document.querySelector('#chart');
  if (!canvas) return;
  const points = records(selected).slice(0,60).reverse();
  const {low,high} = config(selected);
  const series = points.map(row => row.value);
  const min = Math.min(...series,...[low,high].filter(value => value !== null));
  const max = Math.max(...series,...[low,high].filter(value => value !== null));
  const pad = (max-min)*.12 || Math.max(Math.abs(max)*.04,.01);
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const {width,height} = canvas.getBoundingClientRect();
  const scale = window.devicePixelRatio || 1;
  canvas.width = width*scale;
  canvas.height = height*scale;
  ctx.scale(scale,scale);
  const top = 12, bottom = height-32;
  ctx.font = '12px system-ui';
  const ticks = Array.from({length:5},(_,i) => min-pad+i*(max-min+2*pad)/4);
  const left = Math.max(45,...ticks.map(value => ctx.measureText(format(Number(value.toPrecision(6)))).width+10));
  const right = width-12;
  const y = value => bottom-(value-min+pad)/(max-min+2*pad)*(bottom-top);
  const dateStart = Date.parse(points[0].date);
  const dateEnd = Date.parse(points.at(-1).date);
  const x = row => dateEnd === dateStart ? (left+right)/2 : left+(Date.parse(row.date)-dateStart)/(dateEnd-dateStart)*(right-left);
  if (low !== null || high !== null) {
    const start = high === null ? top : y(high);
    ctx.fillStyle = '#193c3e';
    ctx.fillRect(left,start,right-left,(low === null ? bottom : y(low))-start);
  }
  for (const value of ticks) {
    ctx.strokeStyle = '#32445a';
    ctx.beginPath(); ctx.moveTo(left,y(value)); ctx.lineTo(right,y(value)); ctx.stroke();
    ctx.fillStyle = '#a3b5ca';
    ctx.fillText(format(Number(value.toPrecision(6))),0,y(value)+4);
  }
  ctx.strokeStyle = '#48d8ee'; ctx.lineWidth = 2.5; ctx.beginPath();
  points.forEach((row,index) => index ? ctx.lineTo(x(row),y(row.value)) : ctx.moveTo(x(row),y(row.value)));
  ctx.stroke();
  ctx.fillStyle = '#48d8ee';
  for (const row of points) {
    ctx.beginPath(); ctx.arc(x(row),y(row.value),3.5,0,Math.PI*2); ctx.fill();
  }
  const shortDate = value => new Date(value).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  ctx.fillStyle = '#a3b5ca';
  ctx.fillText(shortDate(dateStart),left,bottom+22);
  if (dateEnd !== dateStart) {
    const label = shortDate(dateEnd);
    ctx.fillText(label,right-ctx.measureText(label).width,bottom+22);
  }
}

function localDate(value) {

  return new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16);

const PHOTO_FIELDS = [
  ['alk',/^(?:D[ .-]*ALK|ALKALINITY|ALK|DKH)(?=\s|[:=])/i],
  ['salt',/^(?:SALINITY|SAL)(?=\s|[:=])/i],
  ['ph',/^P\s*H(?=\s|[:=])/i],
  ['no3',/^(?:NITRATE|NO[3₃])(?!\s*-\s*N)(?=\s|[:=])/i],
  ['po4',/^(?:PHOSPHATE|PHOS|P[O0][4₄])(?!\s*-\s*P)(?=\s|[:=])/i],
  ['ca',/^(?:CALCIUM|CA)(?=\s|[:=])/i],
  ['mg',/^(?:MAGNESIUM|MG)(?=\s|[:=])/i],
  ['no2',/^(?:NITRITE|NO[2₂])(?!\s*-\s*N)(?=\s|[:=])/i],
  ['si',/^(?:SILICATE|SILICA|SIO[2₂])(?=\s|[:=])/i],
  ['nh3',/^(?:TOTAL AMMONIA|AMMONIA|AMMO|NH[3₃])(?!\s*-\s*N)(?=\s|[:=])/i]
];

function scanResults(text) {
  const readings = new Map();
  const ambiguous = new Set();
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim().replace(/^[|*•]+\s*/,'');
    const entry = PHOTO_FIELDS.find(([,label]) => label.test(line));
    if (!entry) continue;
    const [key,pattern] = entry;
    const label = line.match(pattern)[0];
    const rest = line.slice(label.length).trim()
      .replace(/^\(\s*(?:NO[23₃₂]|PO[4₄]|Ca|Mg|NH[3₃](?:\s*[+/]\s*NH[4₄])?)\s*\)\s*/i,'');
    const match = rest.match(/^(?:\(\s*(ppm|mg\s*\/\s*l|ppt|psu|dkh)\s*\)\s*)?[:=]?\s*(\d+(?:[.,]\s*\d+)?|[.,]\d+)\s*(ppm|mg\s*\/\s*l|ppt|psu|dkh)?\s*[|]*$/i);
    if (!match) { ambiguous.add(key); continue; }
    const units = [match[1],match[3]].filter(Boolean).map(unit => unit.replace(/\s/g,'').toLowerCase());
    const expected = key === 'alk' ? ['dkh'] : key === 'salt' ? ['ppt','psu'] : key === 'ph' ? [] : ['ppm','mg/l'];
    if (units.some(unit => !expected.includes(unit)) ||
        (key === 'alk' && !units.length && !/^(?:D[ .-]*ALK|DKH)$/i.test(label))) {
      ambiguous.add(key);
      continue;
    }
    const value = Number(match[2].replace(',','.').replace(/\s/g,''));
    const plausible = Number.isFinite(value) && value >= 0 &&
      (key !== 'ph' || value <= 14) &&
      (key !== 'salt' || (value >= 5 && value <= 80)) &&
      (key !== 'alk' || value <= 35);
    if (!plausible || (readings.has(key) && readings.get(key) !== value)) {
      ambiguous.add(key);
      continue;
    }
    readings.set(key,value);
  }
  for (const key of ambiguous) readings.delete(key);
  return {readings,ambiguous};
}

let photoEngine;
function getPhotoEngine() {
  if (photoEngine) return photoEngine;
  photoEngine = new Promise((resolve,reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js';
    script.onload = () => window.Tesseract?.createWorker ? resolve(window.Tesseract) : reject(Error('Scanner unavailable'));
    script.onerror = () => { script.remove(); reject(Error('Scanner unavailable')); };
    document.head.append(script);
  }).catch(error => { photoEngine = null; throw error; });
  return photoEngine;
}

async function photoCanvas(file) {
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const scale = Math.min(1,2200/Math.max(image.naturalWidth,image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1,Math.round(image.naturalWidth*scale));
    canvas.height = Math.max(1,Math.round(image.naturalHeight*scale));
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(image,0,0,canvas.width,canvas.height);
    return canvas;
  } finally { URL.revokeObjectURL(url); }
}

function enablePhotoScan() {
  const status = form.querySelector('#photo-status');
  const photoButtons = [...form.querySelectorAll('[data-photo-picker]')];
  const saveButton = form.querySelector('button.primary');
  const previous = new Map();
  for (const button of photoButtons) {
    const picker = form.querySelector('#'+button.dataset.photoPicker);
    button.onclick = () => picker.click();
    picker.onchange = async () => {
      const file = picker.files[0];
      picker.value = '';
      if (!file) return;
      const current = () => dialog.open && status.isConnected;
      let worker;
      for (const control of [...photoButtons,saveButton]) control.disabled = true;
      status.textContent = 'Preparing the scanner…';
      try {
        const [engine,canvas] = await Promise.all([getPhotoEngine(),photoCanvas(file)]);
        if (!current()) return;
        worker = await engine.createWorker('eng',1,{logger:event => {
          if (current() && event.status === 'recognizing text') {
            status.textContent = 'Reading photo… '+Math.round(event.progress*100)+'%';
          }
        }});
        if (!current()) return;
        await worker.setParameters({tessedit_pageseg_mode:engine.PSM.SINGLE_BLOCK});
        let result = scanResults((await worker.recognize(canvas)).data.text);
        if (result.readings.size < 3 && current()) {
          status.textContent = 'Checking a second layout…';
          await worker.setParameters({tessedit_pageseg_mode:engine.PSM.AUTO});
          const alternate = scanResults((await worker.recognize(canvas)).data.text);
          if (alternate.readings.size > result.readings.size) result = alternate;
        }
        if (!current()) return;
        let count = 0;
        for (const [key,value] of result.readings) {
          const field = form.elements.namedItem(key);
          if (!field || (field.value !== '' && field.value !== previous.get(key))) continue;
          field.value = String(value);
          field.dataset.scanned = '';
          previous.set(key,field.value);
          const details = field.closest('details');
          if (details) details.open = true;
          count++;
        }
        if (count) {
          status.textContent = 'Filled '+count+' reading'+(count===1?'':'s')+'. Check the highlighted numbers before saving.'+
            (result.ambiguous.size ? ' Some results need manual entry.' : '');
        } else if (result.readings.size) {
          status.textContent = 'The matching fields already have readings. Check them against the photo.';
        } else {
          status.textContent = 'No clear labeled readings found. Try a sharper photo or enter them manually.';
        }
      } catch {
        if (current()) status.textContent = 'Could not scan this photo. Try a JPG or PNG with a connection, or enter the readings manually.';
      } finally {
        if (worker) { try { await worker.terminate(); } catch {} }
        if (current()) for (const control of [...photoButtons,saveButton]) control.disabled = false;
      }
    };
  }
}

function showEntry(key,row) {

  form.innerHTML = `<h2 id="entry-title">${row ? 'Edit water test' : 'Add water test'}</h2>
    <p class="muted">Tank · ${esc(state.name)}</p>
    <label>Test date and time<input type="datetime-local" name="date" required value="${localDate(row?.date ?? Date.now())}"></label>
    ${row ? `<label>Parameter<select name="parameter">${choices.map(([id,name,unit]) =>
      `<option value="${id}" ${id===preselected?'selected':''}>${name} ${unit}</option>`).join('')}</select></label>
      <label>Reading<input name="value" type="number" step="any" required value="${row.value}"></label>` :
      `<div class="scan-panel stack">
        <h3>Scan test results</h3>
        <div class="actions">
          <button type="button" data-photo-picker="test-photo">Upload photo</button>
          <button type="button" data-photo-picker="test-camera">Take photo</button>
        </div>
        <input id="test-photo" type="file" accept="image/*" hidden>
        <input id="test-camera" type="file" accept="image/*" capture="environment" hidden>
        <p class="muted" id="photo-status" role="status">Use a clear photo of printed results or a screenshot. The photo stays on your device.</p>
      </div>
      <p class="muted">Review any scanned numbers or enter readings directly. Leave the rest blank.</p>
      <div class="fields">${visible.map(field).join('')}</div>
      ${optional.length ? `<details class="extra-parameters"><summary>Other parameters</summary><div class="fields">${optional.map(field).join('')}</div></details>` : ''}`}
    <label>Notes<textarea name="note" rows="2" maxlength="1000">${esc(row?.note ?? '')}</textarea></label>
    <p class="alert" role="alert" id="entry-error"></p><div class="actions"><button class="primary">Save ${row ? 'reading' : 'readings'}</button>
    <button type="button" id="cancel">Cancel</button></div>`;
  dialog.setAttribute('aria-labelledby','entry-title');
  form.onsubmit = event => {
    event.preventDefault();
    const data = new FormData(form);
    const date = new Date(data.get('date')).toISOString();
    const note = data.get('note').trim();
    const input = row ? [[data.get('parameter'),data.get('value')]] : choices.map(([id]) => [id,data.get(id)]);
    const added = input.filter(([,value]) => value !== '').map(([id,value]) => ({
      id:row?.id ?? (crypto.randomUUID?.() ?? Date.now()+'-'+id+'-'+Math.random().toString(36).slice(2)),
      key:id,value:Number(value),date,note
    }));
    const error = form.querySelector('#entry-error');
    if (!added.length) { error.textContent = 'Enter at least one reading.'; return; }
    try {
      save({...state,readings:[...state.readings.filter(item => item.id !== row?.id),...added]});
      if (page === 'history' && row) selected = added[0].key;
      dialog.close();
      render();
    } catch { error.textContent = 'Could not save in this browser.'; }
  };
  form.querySelector('#cancel').onclick = () => dialog.close();
  if (!row) enablePhotoScan();
  dialog.showModal();
  if (!row && key) form.elements.namedItem(key)?.focus();
}

    window.scrollTo(0,0);

      render();
      main.querySelector('[data-profile-tank="' + CSS.escape(button.dataset.profileTank) + '"][data-profile="' + button.dataset.profile + '"]')?.focus();

    const key = button.dataset.resetTarget;
    const target = profileTarget(key);

    const tank = fleet.tanks.find(item => item.id === button.dataset.removeTank);

    if (message && confirm(message)) {

  if (button.dataset.tank) {
    try { activate({...fleet,active:button.dataset.tank}); }
    catch { alert('Could not switch tanks in this browser.'); }
  }
  if (button.hasAttribute('data-add')) showEntry(button.dataset.add);
  if (button.dataset.edit) {
    const row = state.readings.find(item => item.id === button.dataset.edit);
    if (row) showEntry(row.key,row);
  }
  if (button.dataset.delete && confirm('Delete this reading?')) {
    try { save({...state,readings:state.readings.filter(item => item.id !== button.dataset.delete)}); render(); }
    catch { alert('Could not save the change in this browser.'); }
  }
  if (button.dataset.cloud) void accountAction(button.dataset.cloud);
  if (button.id === 'export') {
    const url = URL.createObjectURL(new Blob([JSON.stringify(fleet,null,2)],{type:'application/json'}));
    const link = document.createElement('a');
    link.href = url; link.download = 'reef-log-backup.json'; link.click();
    setTimeout(() => URL.revokeObjectURL(url),1000);
  }
  if (button.id === 'import') document.querySelector('#backup').click();
});

main.addEventListener('submit',event => {
  if (event.target.id === 'shared-signup') {
    event.preventDefault();
    void signUpWithSharedInvite(event.target);
    return;
  }
  if (event.target.id === 'set-password') {
    event.preventDefault();
    void setAccountPassword(event.target);
    return;
  }
  if (event.target.id === 'email-signin') {
    event.preventDefault();
    void signInWithEmail(event.target);
    return;
  }
  if (event.target.id === 'tank-form') {
    event.preventDefault();
    const name = new FormData(event.target).get('name').trim();
    const message = document.querySelector('#tank-message');
    if (!name) { message.textContent = 'Enter a tank name.'; return; }
    const id = crypto.randomUUID?.() ?? Date.now()+'-'+Math.random().toString(36).slice(2);
    try { activate({...fleet,active:id,tanks:[...fleet.tanks,{id,log:{...defaults(),name}}]}); }
    catch { message.textContent = 'Could not save the tank in this browser.'; }
    return;
  }
  if (event.target.id !== 'targets-form') return;
  event.preventDefault();
  const data = new FormData(event.target);
  const message = document.querySelector('#settings-message');
  const name = data.get('name').trim();
  if (!name) { message.textContent = 'Enter a tank name.'; return; }
  const settings = {};
  const number = key => data.get(key) === '' ? null : Number(data.get(key));
  for (const [key,label] of PARAMETERS) {
    const low = number(key+'-low'), high = number(key+'-high');
    if (low !== null && high !== null && low > high) {
      message.textContent = label + ' minimum must be at or below its maximum.';
      event.target.elements.namedItem(key+'-low').focus();
      return;
    }
    const preset = profileTarget(key);
    const custom = (low !== null || high !== null) && (low !== preset.low || high !== preset.high);
    settings[key] = {enabled:data.has(key+'-enabled'),low,high,days:number(key+'-days'),custom};
  }
  try {
    save({...state,name,settings});
    render();
    document.querySelector('#settings-message').textContent = 'Targets saved.';
  } catch { message.textContent = 'Could not save the targets in this browser.'; }
});

main.addEventListener('change',async event => {
  if (event.target.id === 'history-filter') { selected=event.target.value; render(); document.querySelector('#history-filter').focus(); }
  if (event.target.id !== 'backup') return;
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const message = document.querySelector('#backup-message');
  let restored;
  try { restored = validateFleet(JSON.parse(await file.text())); }
  catch { message.textContent = 'This file is not a valid Reef Log backup.'; return; }
  if (!confirm('Replace all tanks, readings, and targets in this browser with the backup?')) return;
  try { saveFleet(restored); render(); document.querySelector('#backup-message').textContent = 'Backup restored.'; }
  catch { message.textContent = 'Could not restore the backup in this browser.'; }
});

function emptyFleet() {
  return {version:2,active:'first',tanks:[{id:'first',log:defaults()}]};
}

function browserFleet() {
  const saved = localStorage.getItem(STORAGE);
  return saved ? validateFleet(JSON.parse(saved)) : emptyFleet();
}

function hasBrowserLog() {
  try { return localStorage.getItem(STORAGE) !== null; }
  catch { return false; }
}

function cacheCloud(current,log,version,pending) {
  localStorage.setItem(STORAGE + ':cloud:' + current.id,JSON.stringify({log,version,pending}));
}

function account() {
  if (!cloud && sharedInvite) return `<section class="panel stack"><h1>Create your Reef Log account</h1>
    <p>Enter your email and choose a password to save your tank logs.</p>
    <form id="shared-signup" class="stack">
      <label>Email address<input type="email" name="email" autocomplete="username" required maxlength="254"></label>
      <label>Password<input type="password" name="password" autocomplete="new-password" required minlength="12" maxlength="72" aria-describedby="signup-password-rules"></label>
      <p class="muted" id="signup-password-rules">Use at least 12 characters. Keep your password handy since email is not verified.</p>
      <div><button class="primary">Create account</button></div>
    </form>
    <p id="cloud-status" role="status">${esc(authMessage)}</p>
    <div><button data-cloud="show-signin">Already have an account? Sign in</button></div></section>`;
  if (!cloud) return `<section class="panel stack"><h1>Account</h1>
    <p>Use your invited email and password. New accounts require an invitation from the Reef Log owner.</p>
    <form id="email-signin" class="stack"><label>Email address<input type="email" name="email" autocomplete="username" required maxlength="254"></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><div><button class="primary">Sign in</button></div></form>
    <p id="cloud-status" role="status">${esc(authMessage)}</p></section>`;
  if (passwordSetupUser === cloud.id) {
    const isInvite = passwordSetupType === 'invite';
    return `<section class="panel stack"><h1>${isInvite ? 'Create your Reef Log account' : 'Set account password'}</h1>
      <p>${isInvite ? 'Use the email on your invitation and choose a password.' : 'Choose a new password for this account.'}</p>
      <form id="set-password" class="stack">
        <label>Email address<input type="email" name="email" value="${esc(cloud.email)}" autocomplete="username" readonly></label>
        <label>${isInvite ? 'Password' : 'New password'}<input type="password" name="password" autocomplete="new-password" required minlength="12" aria-describedby="password-requirements"></label>
        <p class="muted" id="password-requirements">Use at least 12 characters.</p>
        <div><button class="primary">${isInvite ? 'Create account' : 'Save password'}</button></div>
      </form>
      <p id="cloud-status" role="status">${esc(cloud.passwordMessage ?? '')}</p>
    </section>`;
  }
  const canImport = cloud.ready && !cloud.version && !cloud.pending && hasBrowserLog();
  return `<section class="panel stack"><h1>Account</h1><p>Signed in as ${esc(cloud.email)}</p>
    <p id="cloud-status" role="status">${esc(cloud.message)}</p>
    <div class="actions">
      ${canImport ? '<button class="primary" data-cloud="import">Import this browser’s log</button>' : ''}
      <button data-cloud="sync">Sync now</button>
      ${cloud.conflict ? '<button data-cloud="reload">Load cloud version</button>' : ''}
      <button data-cloud="signout">Sign out</button>
    </div>
    ${cloud.shareLink ? `<div class="invite-share stack"><h2>Invite people</h2>
      <p class="muted">Share the same link with anyone you want to invite.</p>
      <div class="actions"><button type="button" data-cloud="copy-invite">Copy invite link</button></div>
      <label id="invite-link-label" hidden>Invite link<input id="invite-link" type="url" value="${esc(cloud.shareLink)}" readonly></label>
      <p id="invite-copy-status" role="status"></p>
    </div>` : ''}
    <p class="muted">The browser log stays separate. Import it to start a new cloud log, or export it while signed out for a backup.</p></section>`;
}

function refreshAccount() {
  if (page === 'account') render();
}

async function loadCloud(current,discardPending = false) {
  const {data,error} = await cloudClient.from('reef_log_books')
    .select('version,log').eq('owner_id',current.id).maybeSingle();
  if (error) throw error;
  if (cloud !== current || (current.pending && !discardPending)) return;
  const changed = discardPending || !current.ready || current.version !== (data?.version ?? null);
  const log = data ? validateFleet(data.log) : emptyFleet();
  cacheCloud(current,log,data?.version ?? null,false);
  current.ready = true;
  current.version = data?.version ?? null;
  current.message = data ? 'Synced with your account.' :
    'Your cloud log is empty. You can import this browser’s log or add a new reading.';
  if (changed) {
    showFleet(log);
    if (!dialog.open && !renameDialog.open && !main.querySelector('form:focus-within')) render();
  }
}

async function syncCloud(current) {
  if (cloud !== current || current.busy || current.conflict) return;
  current.busy = true;
  const startedPending = current.pending;
  try {
    if (!current.pending) {
      if (!dialog.open && !renameDialog.open && !main.querySelector('form:focus-within')) await loadCloud(current);
      return;
    }
    while (cloud === current && current.pending) {
      const snapshot = fleet;
      const nextVersion = crypto.randomUUID();
      const row = {owner_id:current.id,version:nextVersion,log:snapshot};
      const table = cloudClient.from('reef_log_books');
      const result = current.version ? await table.update(row).eq('owner_id',current.id)
        .eq('version',current.version).select('version').maybeSingle() :
        await table.insert(row).select('version').single();
      if (cloud !== current) return;
      if (result.error?.code === '23505' || (!result.data && !result.error)) {
        current.conflict = true;
        current.message = 'The cloud log changed on another device. Export this device’s log before loading the cloud version.';
        return;
      }
      if (result.error) throw result.error;
      current.version = nextVersion;
      current.pending = fleet !== snapshot;
      cacheCloud(current,fleet,current.version,current.pending);
      current.message = 'Saved to your account.';
    }
  } catch(error) {
    current.message = error?.code === '42501' ?
      'This account does not have access to Reef Log cloud storage.' :
      'Sync is unavailable. Changes saved on this device can be retried from Account.';
  } finally {
    current.busy = false;
    if (cloud === current) {
      if (!main.querySelector('#set-password:focus-within')) refreshAccount();
      if (!startedPending && current.pending) void syncCloud(current);
    }
  }
}

async function changeSession(user) {
  if ((user?.id ?? null) === (cloud?.id ?? null)) return;
  dialog.close();
  renameDialog.close();
  if (!user) {
    cloud = undefined;
    try { showFleet(browserFleet()); }
    catch { showFleet(emptyFleet()); }
    render();
    return;
  }
  const current = cloud = {id:user.id,email:user.email ?? 'your account',ready:false,version:null,pending:false,busy:false,conflict:false,message:'Loading your cloud log…'};
  showFleet(emptyFleet());
  try {
    const cached = JSON.parse(localStorage.getItem(STORAGE + ':cloud:' + current.id) ?? 'null');
    if (cached) {
      showFleet(validateFleet(cached.log));
      current.version = cached.version;
      current.pending = cached.pending === true;
      current.ready = true;
    }
  } catch { current.message = 'The cached log could not be opened.'; }
  render();
  await syncCloud(current);
  void loadShareLink(current);
}

async function loadShareLink(current) {
  try {
    const {data} = await cloudClient.auth.getSession();
    if (data.session?.user.id !== current.id || cloud !== current) return;
    const result = await fetch(CLOUD_URL + '/functions/v1/reef-log-share',{
      method:'POST',headers:{apikey:CLOUD_KEY,Authorization:'Bearer ' + data.session.access_token},
      cache:'no-store'
    });
    if (!result.ok || cloud !== current) return;
    const {link} = await result.json();
    if (cloud !== current || typeof link !== 'string' || !link.startsWith(REEF_URL + '#join=')) return;
    current.shareLink = link;
    if (!main.querySelector('form:focus-within')) refreshAccount();
  } catch { /* The invite controls are optional, so account sync remains available. */ }
}

async function copyInviteLink() {
  if (!cloud?.shareLink) return;
  const status = document.querySelector('#invite-copy-status');
  try {
    await navigator.clipboard.writeText(cloud.shareLink);
    status.textContent = 'Invite link copied.';
  } catch {
    document.querySelector('#invite-link-label').hidden = false;
    const input = document.querySelector('#invite-link');
    input.focus();
    input.select();
    status.textContent = 'Copy the selected invite link.';
  }
}

function finishSharedInvite() {
  sharedInvite = null;
  if (new URLSearchParams(location.hash.slice(1)).has('join')) {
    window.history.replaceState(null,'',location.pathname + location.search);
  }
}

async function signUpWithSharedInvite(form) {
  const data = new FormData(form);
  const email = data.get('email').trim();
  const password = data.get('password');
  const button = form.querySelector('button');
  const status = document.querySelector('#cloud-status');
  const invite = sharedInvite;
  if (!invite) return;
  button.disabled = true;
  status.textContent = 'Creating your account…';
  try {
    if (!cloudClient) throw Error('Sign-up is loading. Try again in a moment.');
    const response = await fetch(CLOUD_URL + '/functions/v1/reef-log-join',{
      method:'POST',
      headers:{apikey:CLOUD_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({invite,email,password})
    });
    const result = await response.json();
    if (!response.ok || !result.created) throw Error(result.error || 'Could not create the account.');
    const {error} = await cloudClient.auth.signInWithPassword({email,password});
    finishSharedInvite();
    authMessage = error ? 'Account created. Sign in with the email and password you just set.' : '';
    refreshAccount();
  } catch(error) {
    authMessage = error?.message || 'Could not create the account. Try again.';
    status.textContent = authMessage;
  } finally {
    button.disabled = false;
  }
}

async function signInWithEmail(form) {
  const data = new FormData(form);
  const button = form.querySelector('button');
  button.disabled = true;
  try {
    if (!cloudClient) throw Error('Authentication unavailable');
    const {error} = await cloudClient.auth.signInWithPassword({
      email:data.get('email').trim(),password:data.get('password')
    });
    if (error) throw error;
  } catch(error) {
    authMessage = error?.status === 429 ? 'Too many attempts. Wait a minute and try again.' :
      'Sign-in failed. Check your invited email and password.';
    refreshAccount();
  } finally { button.disabled = false; }
}

function setPasswordSetup(userId,type = 'recovery') {
  passwordSetupUser = userId;
  passwordSetupType = type;
  try {
    if (userId) sessionStorage.setItem(PASSWORD_SETUP_KEY,type === 'invite' ? 'invite:' + userId : userId);
    else sessionStorage.removeItem(PASSWORD_SETUP_KEY);
  } catch { /* Keep the current-page state if session storage is unavailable. */ }
}

async function setAccountPassword(form) {
  const current = cloud;
  if (!current || passwordSetupUser !== current.id) return;
  const button = form.querySelector('button');
  button.disabled = true;
  try {
    const {error} = await cloudClient.auth.updateUser({password:new FormData(form).get('password')});
    if (error) throw error;
    setPasswordSetup(null);
    current.message = 'Password saved. Use your email and password next time.';
  } catch {
    current.passwordMessage = 'Could not save that password. Try again.';
  } finally {
    button.disabled = false;
    if (cloud === current) refreshAccount();
  }
}

async function redeemInvite(token,type) {
  try {
    const {data,error} = await cloudClient.auth.verifyOtp({token_hash:token,type});
    if (error || !data.user) throw error ?? Error('Missing verified account');
    setPasswordSetup(data.user.id,type);
    authMessage = '';
  } catch {
    authMessage = 'This link has expired or was already used. Ask for a new link.';
  }
  refreshAccount();
}

async function accountAction(action) {
  try {
    if (action === 'copy-invite') await copyInviteLink();
    if (action === 'show-signin') {
      finishSharedInvite();
      authMessage = '';
      refreshAccount();
    }
    if (action === 'signout') {
      if (cloud?.busy) { cloud.message = 'Wait for the current sync before signing out.'; refreshAccount(); return; }
      const {error} = await cloudClient.auth.signOut({scope:'local'});
      if (error) throw error;
      setPasswordSetup(null);
    }
    if (action === 'import' && cloud?.ready && !cloud.version && !cloud.pending) {
      saveFleet(browserFleet());
      refreshAccount();
    }
    if (action === 'sync' && cloud) await syncCloud(cloud);
    if (action === 'reload' && cloud?.conflict &&
        confirm('Replace this device’s unsynced cloud copy with the latest cloud log?')) {
      const current = cloud;
      await loadCloud(current,true);
      if (cloud !== current) return;
      cloud.pending = false;
      cloud.conflict = false;
      refreshAccount();
    }
  } catch {
    if (cloud) cloud.message = 'That action could not be completed. Please try again.';
    else authMessage = 'Sign-in is unavailable. Please try again.';
    refreshAccount();
  }
}

document.addEventListener('keydown',event => {
  const menu = document.querySelector('#settings-menu');
  if (event.key === 'Escape' && menu?.open) {
    menu.open = false;
    menu.querySelector('summary').focus();
  }
});
window.addEventListener('resize',draw);
window.addEventListener('online',() => { if (cloud) void syncCloud(cloud); });
window.addEventListener('focus',() => { if (cloud) void syncCloud(cloud); });
render();
if (location.href.startsWith(REEF_URL)) {
  const authParams = new URL(location.href).searchParams;
  function readInviteLink() {
    const link = new URLSearchParams(location.hash.slice(1));
    const token = link.get('token_hash');
    const type = link.get('type');
    if (!/^[A-Za-z0-9_-]{40,128}$/.test(token ?? '') || !['invite','recovery'].includes(type)) return null;
    window.history.replaceState(null,'',location.pathname + location.search);
    authMessage = 'Checking your invitation…';
    page = 'account';
    render();
    return {token,type};
  }
  function openSharedInvite() {
    const invite = new URLSearchParams(location.hash.slice(1)).get('join');
    if (!/^[A-Za-z0-9_-]{43}$/.test(invite ?? '')) return;
    sharedInvite = invite;
    authMessage = '';
    page = 'account';
    render();
  }
  openSharedInvite();
  let invitation = readInviteLink();
  if (!invitation && (authParams.has('code') || authParams.has('error'))) {
    authMessage = 'Opening your account…';
    page = 'account';
    render();
  }
  window.addEventListener('hashchange',() => {
    openSharedInvite();
    const next = readInviteLink();
    if (!next) return;
    invitation = next;
    if (cloudClient) void redeemInvite(next.token,next.type);
  });
  import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.1/+esm').then(({createClient}) => {
    cloudClient = createClient(CLOUD_URL,CLOUD_KEY,{auth:{
      flowType:'pkce',storageKey:'reef-log-github-auth',persistSession:true,detectSessionInUrl:true
    }});
    cloudClient.auth.onAuthStateChange((_event,session) => {
      setTimeout(() => void changeSession(session?.user),0);
    });
    if (invitation) void redeemInvite(invitation.token,invitation.type);
  }).catch(() => {
    authMessage = 'Cloud sign-in could not load. Your browser log is available.';
    refreshAccount();
  });
}
</script>
</body>
